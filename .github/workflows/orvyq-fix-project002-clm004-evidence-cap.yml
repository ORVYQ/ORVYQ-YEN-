name: ORVYQ Fix Project 002 CLM004 Evidence Cap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-fix-project002-clm004-evidence-cap.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified narration alignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30341216914 \
            --repo "${{ github.repository }}" \
            --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30341216914 \
            --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json \
             projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Author a second source-backed timeline break
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          plan=json.loads(p.read_text())
          claim='CLM_004_JAPAN_INDUSTRIAL_TIMELINE'
          breaks=plan.setdefault('graphic_break_assignments',{}).setdefault(claim,{})
          breaks['7']={
            'mode':'illustrative',
            'title':'A TEST PROGRAM IS NOT A COMMERCIAL DATE',
            'subtitle':'The 2027 integrated trial is followed by assessment; it does not establish an operating mine.',
            'labels':['2027 INTEGRATED TRIAL','ASSESSMENT','NO COMMERCIAL START DATE'],
            'maxSeconds':4.5,
            'semantic_anchor':'A completed lift test is not an integrated commercial supply chain.',
            'editorial_rationale':'This source-backed timeline distinction prevents the single JAMSTEC 2027 figure from being repeated beyond the two-use source cap while preserving two physical official-figure appearances and making the planned-versus-commercial boundary explicit.'
          }
          plan['generation_policy']='demand-led narration-anchored footage acquisition; every long evidence run is interrupted only by claim-specific verified footage or source-backed graphics; official evidence sources remain within the two-use cap; no fixed clip-count completion and no silent fallback'
          p.write_text(json.dumps(plan,indent=2)+'\n')
          PY

      - name: Validate full production and candidate edit plan
        run: |
          set -euo pipefail
          node scripts/orvyq_full_production_plan.mjs --project-id=002-the-new-war-beneath-the-ocean
          node scripts/orvyq_edit_plan.mjs --project-id=002-the-new-war-beneath-the-ocean --mode=full

      - name: Commit authored evidence-cap fix
        run: |
          set -euo pipefail
          git config user.name "orvyq-evidence-editor"
          git config user.email "orvyq-evidence-editor@users.noreply.github.com"
          git checkout -- projects/002-the-new-war-beneath-the-ocean/direction/editorial_blueprint.json \
                          projects/002-the-new-war-beneath-the-ocean/direction/editorial_pause_map.json \
                          projects/002-the-new-war-beneath-the-ocean/direction/edit_plan.json || true
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          if git diff --cached --quiet; then
            echo "CLM004 evidence-cap fix already present."
          else
            git commit -m "Keep CLM004 JAMSTEC evidence within source cap"
            git pull --rebase origin agent/002-deep-sea-cold-war
            git push origin HEAD:agent/002-deep-sea-cold-war
          fi

      - name: Re-dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched after CLM_004 was re-authored to keep the JAMSTEC 2027 trial figure within the two-use source cap. Two physical official-figure appearances remain; the additional beat is a source-backed planned-trial-versus-commercial-date timeline. No quality threshold was weakened."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project002-clm004-evidence-cap-${{ github.run_id }}
          path: |
            projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
            projects/002-the-new-war-beneath-the-ocean/direction/editorial_blueprint.json
            projects/002-the-new-war-beneath-the-ocean/direction/edit_plan.json
          retention-days: 30
