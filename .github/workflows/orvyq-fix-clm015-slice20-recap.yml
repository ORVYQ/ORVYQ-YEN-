name: ORVYQ Fix CLM015 Slice 20 Recap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-fix-clm015-slice20-recap.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Restore verified narration alignment and pauses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30376871334 --repo "${{ github.repository }}" --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30376871334 --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean
      - name: Apply feasible CLM015 slice 20 recap duration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          d=json.loads(p.read_text())
          card=d['graphic_break_assignments']['CLM_015_MIDWATER_DISCHARGE_RISK']['20']
          card['maxSeconds']=7.99
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Validate full production plan
        run: node scripts/orvyq_full_production_plan.mjs --project-id=002-the-new-war-beneath-the-ocean
      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name orvyq-validation-fixer
          git config user.email orvyq-validation-fixer@users.noreply.github.com
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          if git diff --cached --quiet; then
            echo "Correction already present; continuing."
          else
            git commit -m "Use feasible CLM015 slice 20 recap duration"
            git pull --rebase origin agent/002-deep-sea-cold-war
            git push origin HEAD:agent/002-deep-sea-cold-war
          fi
      - name: Re-dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml --repo "${{ github.repository }}" --ref agent/002-deep-sea-cold-war -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments -f body="Project 002 Candidate Validation re-dispatched after CLM_015 slice 20 recap was set to the verified feasible 7.99-second duration under the unchanged 8-second shot cap. No quality threshold was weakened."
