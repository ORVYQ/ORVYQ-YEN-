name: ORVYQ Fix CLM008 Recap Cap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-fix-clm008-recap-cap.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified narration alignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30349530672 \
            --repo "${{ github.repository }}" \
            --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30349530672 \
            --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json \
             projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Set feasible CLM008 recap duration cap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          data = json.loads(p.read_text())
          card = data['graphic_break_assignments']['CLM_008_NO_US_COMMERCIAL_PERMIT']['2']
          card['maxSeconds'] = 6.5
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate full production plan before commit
        run: node scripts/orvyq_full_production_plan.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Commit verified project configuration
        run: |
          set -euo pipefail
          git checkout -- projects/002-the-new-war-beneath-the-ocean/direction/editorial_blueprint.json || true
          git config user.name "orvyq-coverage-editor"
          git config user.email "orvyq-coverage-editor@users.noreply.github.com"
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          if git diff --cached --quiet; then
            echo "Project configuration already current."
          else
            git commit -m "Use feasible CLM008 recap duration cap"
            git pull --rebase origin agent/002-deep-sea-cold-war
            git push origin HEAD:agent/002-deep-sea-cold-war
          fi

      - name: Re-dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched after replacing the infeasible CLM_008 5-second recap cap with a validated 6.5-second cap. The whole-film generic-card budget remains below the 8% ceiling; no quality gate was weakened."
