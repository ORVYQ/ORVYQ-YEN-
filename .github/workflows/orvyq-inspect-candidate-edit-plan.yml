name: Inspect Project 002 Candidate Edit Plan Failure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-candidate-edit-plan.yml"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact failing edit-plan log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/jobs/90217013880/logs > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/job.log').read_text(errors='replace')
          marker='Build the canonical candidate edit plan'
          idx=text.find(marker)
          if idx < 0:
              out=text[-16000:]
          else:
              out=text[idx:idx+20000]
          Path('diagnostics/project002-candidate-edit-plan-failure.txt').write_text(out)
          PY
          body=$(python - <<'PY'
          from pathlib import Path
          text=Path('diagnostics/project002-candidate-edit-plan-failure.txt').read_text(errors='replace')
          print('Project 002 exact candidate edit-plan failure from run `30341216914`, job `90217013880`:\n\n```text\n'+text[-12000:]+'\n```')
          PY
          )
          gh api repos/${{ github.repository }}/issues/3/comments -f body="$body"
          git config user.name "orvyq-inspector"
          git config user.email "orvyq-inspector@users.noreply.github.com"
          git add diagnostics/project002-candidate-edit-plan-failure.txt
          git commit -m "Record Project 002 candidate edit-plan failure [skip ci]"
          git push origin HEAD:main
