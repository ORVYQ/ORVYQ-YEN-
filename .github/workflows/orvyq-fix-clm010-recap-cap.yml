name: ORVYQ Fix Recap Capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-fix-clm010-recap-cap.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified narration alignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30352163491 \
            --repo "${{ github.repository }}" \
            --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30352163491 \
            --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json \
             projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Set feasible authored recap duration caps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          data = json.loads(p.read_text())
          data['graphic_break_assignments']['CLM_010_SCARCITY_IS_MINERAL_SPECIFIC']['2']['maxSeconds'] = 7.75
          data['graphic_break_assignments']['CLM_015_MIDWATER_DISCHARGE_RISK']['6']['maxSeconds'] = 6.5
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate full production plan before commit
        id: validate
        shell: bash
        run: |
          set +e
          node scripts/orvyq_full_production_plan.mjs --project-id=002-the-new-war-beneath-the-ocean 2>&1 | tee /tmp/recap-cap-validation.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report exact validation failure
        if: failure() && steps.validate.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/recap-cap-validation.log').read_text(errors='replace')
          print('Exact Project 002 full-production validation failure after feasible recap-cap corrections:\n\n```text\n'+text[-7000:]+'\n```')
          PY
          )"
          gh api repos/${{ github.repository }}/issues/3/comments -f body="$body"

      - name: Commit verified project configuration
        if: success()
        run: |
          set -euo pipefail
          git checkout -- projects/002-the-new-war-beneath-the-ocean/direction/editorial_blueprint.json projects/002-the-new-war-beneath-the-ocean/direction/editorial_pause_map.json || true
          git config user.name "orvyq-coverage-editor"
          git config user.email "orvyq-coverage-editor@users.noreply.github.com"
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          if git diff --cached --quiet; then
            echo "Recap caps are already current; continuing without an empty commit."
          else
            git commit -m "Use feasible authored recap duration caps"
            git pull --rebase origin agent/002-deep-sea-cold-war
            git push origin HEAD:agent/002-deep-sea-cold-war
          fi

      - name: Re-dispatch Candidate Validation
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched after setting CLM_010 and CLM_015 authored recap caps to durations supported by their exact neighboring capacity. Card content and all quality thresholds remain unchanged."

# Triggered 2026-07-28 after exact CLM_015 capacity diagnostics.
