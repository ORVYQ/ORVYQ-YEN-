name: ORVYQ Planner Test Generalization

on:
  pull_request:
    branches:
      - "claude/orvyq-assets-soundtrack-port-noz6bi"
    paths:
      - "scripts/migrations/generalize-full-plan-test.mjs"
      - ".github/workflows/orvyq-generalize-planner-test.yml"

permissions:
  contents: write

concurrency:
  group: orvyq-planner-test-generalization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generalize planner integration test
        run: node scripts/migrations/generalize-full-plan-test.mjs

      - name: Run affected tests
        run: node --test scripts/orvyq_full_production_plan.test.mjs scripts/orvyq_materialize_footage.test.mjs scripts/orvyq_promote_evidence_assets.test.mjs scripts/orvyq_resolve_pauses.test.mjs

      - name: Commit migrated test
        run: |
          set -euo pipefail
          git config user.name "orvyq-test-migration-bot"
          git config user.email "orvyq-test-migration-bot@users.noreply.github.com"
          git add scripts/orvyq_full_production_plan.test.mjs
          if git diff --cached --quiet; then
            echo "Test already generalized"
            exit 0
          fi
          git commit -m "Generalize planner integration test across projects"
          git push origin "HEAD:${{ github.head_ref }}"
