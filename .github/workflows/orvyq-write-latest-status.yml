name: ORVYQ Write Latest Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-write-latest-status.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write latest validation and review status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .orvyq
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq '{generated_at: now|todate, runs: [.workflow_runs[] | select(.name == "ORVYQ Candidate Validation" or .name == "ORVYQ Full-Length Review" or .name == "ORVYQ Full Length Review")][0:15] | map({id,name,status,conclusion,head_sha,event,html_url,created_at,updated_at})}' \
            > .orvyq/latest-runs.json
          git config user.name "orvyq-status-bot"
          git config user.email "orvyq-status-bot@users.noreply.github.com"
          git add .orvyq/latest-runs.json
          git commit -m "Update ORVYQ workflow status snapshot [skip ci]" || exit 0
          git push
