name: Inspect Candidate Validation 30364320651

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-30364320651.yml"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact full-production failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/jobs/90291577812/logs > /tmp/job.log
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/job.log').read_text(errors='replace').splitlines()
          anchors=[i for i,l in enumerate(lines) if 'orvyq_full_production_plan.mjs' in l and 'Run node' in l]
          idx=anchors[-1] if anchors else max(0,len(lines)-180)
          start=max(0,idx-10); end=min(len(lines),idx+140)
          out='\n'.join(lines[start:end])+'\n'
          Path('diagnostics/candidate-validation-30364320651-error.txt').write_text(out)
          print(out)
          PY
          body="$(sed -n '1,150p' diagnostics/candidate-validation-30364320651-error.txt)"
          gh api repos/${{ github.repository }}/issues/3/comments -f body="Candidate Validation 30364320651 full-production failure:\n\n\`\`\`text\n${body}\n\`\`\`"
          git config user.name orvyq-inspector
          git config user.email orvyq-inspector@users.noreply.github.com
          git add diagnostics/candidate-validation-30364320651-error.txt
          git commit -m "Record Candidate Validation 30364320651 full-production error [skip ci]"
          git push origin HEAD:main
