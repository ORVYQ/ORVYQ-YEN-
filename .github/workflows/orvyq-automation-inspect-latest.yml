name: ORVYQ Automation Inspect Latest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-automation-inspect-latest.yml"

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest validation and review runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${{ github.repository }}/actions/runs?per_page=100")"
          body="$(printf '%s' "$runs" | jq -r '
            [ .workflow_runs[] | select(.name == "ORVYQ Candidate Validation" or .name == "ORVYQ Full-Length Review" or .name == "ORVYQ Full Length Review") ][0:10]
            | if length == 0 then "No validation or review runs found."
              else map("- " + .name + " run `" + (.id|tostring) + "`: status=`" + .status + "`, conclusion=`" + (.conclusion // "null") + "`, head_sha=`" + .head_sha + "`, url=" + .html_url) | "Latest ORVYQ validation/review runs:\n" + join("\n") end')"
          gh api "repos/${{ github.repository }}/issues/3/comments" -f body="$body"

# trigger
