name: ORVYQ One-Time Proof Asset Contract Fix

on:
  push:
    branches:
      - agent/orvyq-cinematic-visual-engine
    paths:
      - .github/workflows/orvyq-one-time-proof-asset-contract-fix.yml

permissions:
  contents: write

concurrency:
  group: orvyq-one-time-proof-asset-contract-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current visual-engine branch
        uses: actions/checkout@v4
        with:
          ref: agent/orvyq-cinematic-visual-engine
          fetch-depth: 0

      - name: Align proof fixture with canonical asset contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('.github/acceptance-proof/run.sh')
          text = script.read_text()
          replacements = {
              'PUBLIC="templates/remotion/public/assets"': 'PUBLIC="assets"',
              "public = Path('templates/remotion/public/assets')": "public = Path('assets')",
              '- Generic CI run: `30476764932` — completed / success': "- Workflow run: `{os.environ.get('GITHUB_RUN_ID')}` — generic validation and acceptance proof",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected proof fixture text is missing: {old}')
              text = text.replace(old, new, 1)
          if 'templates/remotion/public/assets' in text:
              raise SystemExit('obsolete proof asset root remains')
          if '30476764932' in text:
              raise SystemExit('stale hardcoded CI run remains')
          script.write_text(text)
          PY

      - name: Verify canonical contract and script syntax
        run: |
          set -euo pipefail
          grep -F 'Config.setPublicDir("../../");' templates/remotion/remotion.config.ts
          grep -F 'PUBLIC="assets"' .github/acceptance-proof/run.sh
          grep -F "public = Path('assets')" .github/acceptance-proof/run.sh
          grep -F 'GITHUB_RUN_ID' .github/acceptance-proof/run.sh
          bash -n .github/acceptance-proof/run.sh

      - name: Commit fixture correction and remove patch workflow
        run: |
          set -euo pipefail
          rm .github/workflows/orvyq-one-time-proof-asset-contract-fix.yml
          git config user.name "orvyq-system-patcher"
          git config user.email "orvyq-system-patcher@users.noreply.github.com"
          git add .github/acceptance-proof/run.sh .github/workflows/orvyq-one-time-proof-asset-contract-fix.yml
          git diff --cached --check
          git commit -m "Align synthetic proof assets with canonical public root" -m "Proof fixture root cause: generated assets were written under templates/remotion/public even though the canonical renderer contract exposes the project root through Config.setPublicDir(\"../../\"). The shared renderer was correct. This commit changes only the synthetic fixture to write assets/ paths at the canonical root and replaces a stale hardcoded CI run number with the actual workflow run ID. No runtime selector, renderer, schema, quality threshold, Project 002 data, or production path is changed."
          git push origin HEAD:agent/orvyq-cinematic-visual-engine
