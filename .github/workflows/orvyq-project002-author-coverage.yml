name: ORVYQ Project 002 Author Creative Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-project002-author-coverage.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Restore verified narration alignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30257567458 \
            --repo "${{ github.repository }}" \
            --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30257567458 \
            --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json \
             projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Validate the hand-authored full-film coverage plan
        run: |
          set -euo pipefail
          node scripts/orvyq_full_production_plan.mjs --project-id=002-the-new-war-beneath-the-ocean | tee /tmp/full-plan-result.json

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project002-coverage-validation-${{ github.run_id }}
          path: |
            /tmp/full-plan-result.json
            projects/002-the-new-war-beneath-the-ocean/direction/editorial_blueprint.json
          retention-days: 30

      - name: Re-dispatch Candidate Validation on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
