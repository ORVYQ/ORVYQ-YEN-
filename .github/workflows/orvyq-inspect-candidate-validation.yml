name: Inspect ORVYQ Candidate Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-candidate-validation.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist latest Candidate Validation and Full-Length Review runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${{ github.repository }}/actions/runs?per_page=80")"
          printf '%s' "$runs" | jq -r '
            [.workflow_runs[] | select(.name == "ORVYQ Candidate Validation" or (.name | test("Full-Length Review|Review Render"; "i")))][0:12]
            | map(.name + "|" + (.id|tostring) + "|" + .status + "|" + (.conclusion // "null") + "|" + .head_sha + "|" + .html_url)
            | join("\n")' > diagnostics/latest-orvyq-runs.txt
          git config user.name "orvyq-status-bot"
          git config user.email "orvyq-status-bot@users.noreply.github.com"
          git add diagnostics/latest-orvyq-runs.txt
          git commit -m "Record latest ORVYQ run status [skip ci]" || exit 0
          git push origin HEAD:main

# Trigger revision: inspect terminal-pause retry.
