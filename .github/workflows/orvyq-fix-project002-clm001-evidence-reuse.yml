name: Fix Project 002 CLM001 Evidence Reuse

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-fix-project002-clm001-evidence-reuse.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Restore verified narration alignment and pauses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30297777073 \
            --repo "${{ github.repository }}" \
            --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30297777073 \
            --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json \
             projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Author claim-specific graphic beats for CLM001
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          plan=json.loads(p.read_text())
          claim='CLM_001_JAPAN_TECHNICAL_MILESTONE'
          breaks=plan.setdefault('graphic_break_assignments',{}).setdefault(claim,{})
          authored={
            '1': {
              'mode':'illustrative',
              'title':'5,569 METRES BELOW THE PACIFIC',
              'subtitle':'The test connected a seabed mining machine to a continuous lifting system at extreme depth.',
              'labels':['SEAFLOOR MACHINE','CLOSED-LOOP LIFT','SURFACE VESSEL']
            },
            '3': {
              'mode':'illustrative',
              'title':'CONTINUOUS LIFT WAS THE MILESTONE',
              'subtitle':'Material reached the surface through the connected system; the achievement was technical, not commercial.',
              'labels':['CONNECTED','LIFTED','RECOVERED']
            },
            '5': {
              'mode':'illustrative',
              'title':'A TECHNICAL TEST IS NOT A MINE',
              'subtitle':'Recovery does not establish reserve scale, operating cost or acceptable environmental impact.',
              'labels':['TECHNICAL FEASIBILITY','ECONOMICS UNKNOWN','IMPACT UNRESOLVED']
            },
            '6': {
              'mode':'illustrative',
              'title':'THE SYSTEM WORKED — THE CASE IS NOT CLOSED',
              'subtitle':'JAMSTEC demonstrated the lifting chain while the larger commercial and ecological questions remained open.',
              'labels':['SYSTEM TEST','COMMERCIAL SCALE','ECOLOGICAL LIMIT']
            }
          }
          breaks.update(authored)
          plan['generation_policy']=(
            'evidence-claim opening context; repeated image-sequence evidence is capped by replacing later CLM001 slices '
            'with claim-specific, source-bounded graphic beats; every footage and graphic placement is hand-authored '
            'from verified narration meaning; no index-based assignment, artificial stretching or quality-gate weakening'
          )
          p.write_text(json.dumps(plan,indent=2)+'\n')
          PY

      - name: Validate production and edit plans before commit
        run: |
          set -euo pipefail
          node scripts/orvyq_full_production_plan.mjs --project-id=002-the-new-war-beneath-the-ocean
          node scripts/orvyq_edit_plan.mjs --project-id=002-the-new-war-beneath-the-ocean --mode=full

      - name: Commit authored fix
        run: |
          set -euo pipefail
          git config user.name "orvyq-evidence-editor"
          git config user.email "orvyq-evidence-editor@users.noreply.github.com"
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          git commit -m "Cap CLM001 evidence reuse with source-bounded graphic beats"
          git pull --rebase origin agent/002-deep-sea-cold-war
          git push origin HEAD:agent/002-deep-sea-cold-war

      - name: Re-dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched after replacing excess CLM001 image-sequence reuse with four source-bounded, narration-specific graphic beats. The 2-use evidence cap and semantic relevance gate remain intact."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project002-clm001-evidence-reuse-${{ github.run_id }}
          path: |
            projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
            projects/002-the-new-war-beneath-the-ocean/direction/editorial_blueprint.json
          retention-days: 30
