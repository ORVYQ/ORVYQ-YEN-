name: Fix Project 002 Reuse Rationale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-fix-project002-reuse-rationale.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix-and-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - name: Add deliberate callback rationale to every repeated semantic placement
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          plan = json.loads(path.read_text())
          assignments = plan['footage_assignments']

          reasons = {
            ('CLM_001_JAPAN_TECHNICAL_MILESTONE', '4'): "This industrial-operation image is introduced during Japan's technical milestone and returns later during the industrial timeline as a deliberate bridge from a completed test to the still-unfinished production chain; the two uses occupy distinct trim windows.",
            ('CLM_004_JAPAN_INDUSTRIAL_TIMELINE', '0'): "This industrial-operation image returns from the technical-milestone section at a distinct trim window, deliberately connecting demonstrated lifting capability with the larger production-chain sequence that remains to be proven.",
            ('CLM_002_CHINA_RARE_EARTH_CHOKEPOINT', '2'): "This processing and supply-chain image is introduced under China's material chokepoint and returns under the unfinished mining-code section to contrast physical industrial concentration with unresolved governance; each occurrence uses a distinct trim window.",
            ('CLM_006_MINING_CODE_UNFINISHED', '0'): "This processing and supply-chain image returns from the chokepoint claim at a distinct trim window, linking the physical race for capacity to the legal framework that has not yet been completed.",
            ('CLM_002_CHINA_RARE_EARTH_CHOKEPOINT', '4'): "This mineral-supply image is introduced while explaining concentration risk and returns under mineral-specific scarcity at a distinct trim window, narrowing the broad chokepoint argument to the metals and chemistries that actually matter.",
            ('CLM_010_SCARCITY_IS_MINERAL_SPECIFIC', '0'): "This mineral-supply image returns from the China chokepoint sequence at a distinct trim window, deliberately shifting the same supply question from national concentration to mineral-specific demand and substitution.",
            ('CLM_003_EXPORT_CONTROLS_MATERIALIZED_RISK', '0'): "This trade-and-supply image is introduced when export controls become a physical shortage and returns under common heritage at a distinct trim window, contrasting controlled national supply with resources governed as a shared domain.",
            ('CLM_005_COMMON_HERITAGE_PRINCIPLE', '2'): "This trade-and-supply image returns from the export-control claim at a distinct trim window, deliberately setting national restriction against the common-heritage principle without presenting the stock footage as primary evidence.",
            ('CLM_004_JAPAN_INDUSTRIAL_TIMELINE', '2'): "This processing-chain image is introduced while separating Japan's test milestones and returns under the refining-bottleneck claim at a distinct trim window, connecting extraction hardware to the downstream gate that determines usable supply.",
            ('CLM_011_REFINING_BOTTLENECK', '0'): "This processing-chain image returns from Japan's industrial timeline at a distinct trim window, deliberately showing that reaching or lifting material is not the same as refining it into a strategic input.",
            ('CLM_004_JAPAN_INDUSTRIAL_TIMELINE', '4'): "This human industrial-work image is introduced while describing the planned production chain and returns under the industry's counterargument at a distinct trim window, keeping real workers and operators present on both sides of the trade-off.",
            ('CLM_009_INDUSTRY_COUNTERARGUMENT', '0'): "This human industrial-work image returns from Japan's production timeline at a distinct trim window, deliberately grounding the industry's supply-security argument in the same real-world operational context rather than a new generic cutaway.",
            ('CLM_007_US_PARALLEL_ROUTE', '2'): "This ocean-impact context is introduced while explaining the U.S. parallel route and returns under plume complexity at a distinct trim window, linking regulatory divergence to the environmental behaviour that any route must measure.",
            ('CLM_014_PLUME_SCALE_IS_COMPLEX', '0'): "This ocean-impact context returns from the U.S. parallel-route section at a distinct trim window, deliberately shifting from competing legal routes to the shared physical question of how disturbed sediment moves.",
            ('CLM_008_NO_US_COMMERCIAL_PERMIT', '0'): "This regulatory and operational context is introduced while clarifying that no U.S. commercial permit exists and returns later at a distinct trim window when the film weighs midwater-discharge risk before any commercial decision.",
            ('CLM_015_MIDWATER_DISCHARGE_RISK', '4'): "This regulatory and operational context returns from the no-permit claim at a distinct trim window, deliberately connecting the absence of approval with the unresolved environmental conditions that approval would have to address.",
            ('CLM_013_INDUSTRIAL_TRIAL_BIODIVERSITY', '2'): "This ecological-impact image is introduced with the measured biodiversity result and returns under midwater-discharge risk at a distinct trim window, carrying the film's evidence-led ecological consequence motif from seabed disturbance into the water column.",
            ('CLM_015_MIDWATER_DISCHARGE_RISK', '0'): "This ecological-impact image returns from the industrial-trial biodiversity section at a distinct trim window, deliberately connecting observed biological change with the broader question of where discharged sediment and processing water may create risk."
          }

          changed = 0
          for (claim, index), reason in reasons.items():
            item = assignments[claim][index]
            if not item.get('reuse_reason'):
              item['reuse_reason'] = reason
              changed += 1

          if changed != len(reasons):
            raise SystemExit(f'Expected to add {len(reasons)} reuse reasons, added {changed}; branch state changed, inspect before retrying.')

          path.write_text(json.dumps(plan, indent=2) + '\n')
          print(json.dumps({'ok': True, 'reuse_reasons_added': changed}, indent=2))
          PY

      - name: Commit reusable audit-compliant editorial rationale
        run: |
          set -euo pipefail
          git config user.name "orvyq-editorial-qa"
          git config user.email "orvyq-editorial-qa@users.noreply.github.com"
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          git commit -m "Document deliberate repeated-footage callbacks for Project 002"
          git push origin HEAD:agent/002-deep-sea-cold-war

      - name: Re-dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched after all nine repeated semantic footage pairs received explicit, claim-specific callback rationale. No visual placement or quality threshold was changed."
