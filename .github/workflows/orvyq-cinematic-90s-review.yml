name: ORVYQ Cinematic 90s Review

on:
  workflow_dispatch:
  push:
    branches:
      - agent/orvyq-cinematic-visual-engine
    paths:
      - ".github/workflows/orvyq-cinematic-90s-review.yml"
      - ".github/acceptance-proof/run-90s-review.sh"
      - "templates/remotion/src/visual-modules/CinematicVisualModule.tsx"
  pull_request:
    branches:
      - agent/002-deep-sea-cold-war
    paths:
      - ".github/workflows/orvyq-cinematic-90s-review.yml"
      - ".github/acceptance-proof/run-90s-review.sh"
      - "templates/remotion/src/visual-modules/CinematicVisualModule.tsx"

permissions:
  contents: read

concurrency:
  group: orvyq-cinematic-90s-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SYSTEM_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  render-review:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/orvyq-cinematic-visual-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYSTEM_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Verify shared runtime remains project-independent
        run: |
          set -euo pipefail
          mkdir -p acceptance-proof/pre-render
          node scripts/orvyq_system_independence_audit.mjs
          cp system-independence-report.json acceptance-proof/pre-render/system-independence-report.json

      - name: Install media and SVG tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng librsvg2-bin python3-pil

      - name: Install canonical renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Build and validate the 90-second canonical review
        run: bash .github/acceptance-proof/run-90s-review.sh

      - name: Upload compact review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-cinematic-90s-review-${{ github.run_id }}
          retention-days: 5
          compression-level: 6
          if-no-files-found: warn
          path: |
            acceptance-proof/orvyq-acceptance-proof.mp4
            acceptance-proof/contact-sheet.jpg
            acceptance-proof/proof-validation.json
            acceptance-proof/media-metadata.json
            acceptance-proof/final-edit-plan.json
            acceptance-proof/visual-module-plan.json
            acceptance-proof/frames/first.png
            acceptance-proof/frames/middle.png
            acceptance-proof/frames/end.png
