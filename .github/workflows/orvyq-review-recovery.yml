name: ORVYQ Completed Review Recovery

# One-shot recovery for review run 30124998186. That run rendered and encoded
# every frame successfully, but the workflow attempted ffprobe before ffmpeg
# was installed, so manifest/media QA steps never ran. This workflow downloads
# the existing MP4 byte-for-byte, verifies it against the exact validated
# candidate, runs the skipped QA, and publishes a complete official review
# package. It never renders and never starts Final Encode.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-review-recovery.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-completed-review-recovery
  cancel-in-progress: false

env:
  PROJECT_ID: 001-the-ai-race-no-one-can-afford-to-win
  TARGET_SHA: db60b73164ce4a82fcb1b4b230837a78e80da37e
  VALIDATION_RUN_ID: "30123536505"
  SOURCE_REVIEW_RUN_ID: "30124998186"
  REVIEW_WIDTH: "1280"
  REVIEW_HEIGHT: "720"
  REVIEW_BITRATE: "6M"

jobs:
  recover-review:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact validated candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          lfs: true

      - name: Verify exact source commit
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Download immutable validated candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: orvyq-validated-candidate-bundle-${{ env.VALIDATION_RUN_ID }}
          path: candidate-bundle
          run-id: ${{ env.VALIDATION_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download already-completed review MP4
        uses: actions/download-artifact@v4
        with:
          name: orvyq-full-length-review-${{ env.SOURCE_REVIEW_RUN_ID }}
          path: source-review
          run-id: ${{ env.SOURCE_REVIEW_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Place exact candidate and completed MP4
        run: |
          set -euo pipefail
          test "$(cat candidate-bundle/validation-source-sha.txt)" = "$TARGET_SHA"
          SRC="candidate-bundle/projects/$PROJECT_ID"
          DEST="projects/$PROJECT_ID"
          test -d "$SRC/assets"
          test -d "$SRC/remotion/render_ready_project"
          mkdir -p "$DEST/direction" "$DEST/remotion" "$DEST/qa"
          cp "$SRC/direction/edit_plan.json" "$DEST/direction/edit_plan.json"
          cp "$SRC/remotion/captions.json" "$DEST/remotion/captions.json"
          cp "$SRC/qa/frozen_candidate.json" "$DEST/qa/frozen_candidate.json"
          rm -rf "$DEST/assets" "$DEST/remotion/render_ready_project"
          cp -r "$SRC/assets" "$DEST/assets"
          cp -r "$SRC/remotion/render_ready_project" "$DEST/remotion/render_ready_project"
          mkdir -p "$DEST/remotion/render_ready_project/out"
          VIDEO="$(find source-review -type f -name orvyq_review.mp4 -print -quit)"
          STDOUT="$(find source-review -type f -name review_render_stdout.txt -print -quit)"
          test -n "$VIDEO" && test -s "$VIDEO"
          cp "$VIDEO" "$DEST/remotion/render_ready_project/out/orvyq_review.mp4"
          if [ -n "$STDOUT" ] && [ -s "$STDOUT" ]; then
            cp "$STDOUT" "$DEST/remotion/render_ready_project/out/review_render_stdout.txt"
          fi

      - name: Verify every candidate source and binary asset
        run: node scripts/orvyq_verify_bundle_integrity.mjs --project-id="$PROJECT_ID"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media and speech tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests==2.32.5

      - name: Verify completed MP4 duration and resolution
        run: |
          set -euo pipefail
          VIDEO="projects/$PROJECT_ID/remotion/render_ready_project/out/orvyq_review.mp4"
          EXPECTED="$(node -e "const p=require('./projects/$PROJECT_ID/direction/edit_plan.json'); process.stdout.write(String(p.duration_frames/p.fps))")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$VIDEO")"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nk=1:nw=1 "$VIDEO")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nk=1:nw=1 "$VIDEO")"
          python3 -c "import sys; sys.exit(0 if abs(float('$DURATION')-float('$EXPECTED')) < 1.0 else 1)"
          test "$WIDTH" = "$REVIEW_WIDTH"
          test "$HEIGHT" = "$REVIEW_HEIGHT"
          echo "CANDIDATE_DURATION_SECONDS=$EXPECTED" >> "$GITHUB_ENV"
          echo "REVIEW_VIDEO_SHA256=$(sha256sum "$VIDEO" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Recovered complete review: ${DURATION}s, ${WIDTH}x${HEIGHT}"

      - name: Write official review render manifest
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const candidate = JSON.parse(fs.readFileSync('projects/$PROJECT_ID/qa/frozen_candidate.json', 'utf8'));
            const identity = candidate.canonical_candidate_identity;
            const manifest = {
              schema_version: '2.0',
              identity: {
                candidate_hash: candidate.candidate_hash,
                render_bundle_hash: candidate.render_bundle_hash,
                edit_plan_hash: identity.edit_plan_hash,
                caption_hash: identity.caption_hash,
                final_mix_audio_hash: identity.final_mix_audio_hash || null,
                audio_mix_metadata_hash: identity.audio_mix_metadata_hash,
                asset_manifest_hash: identity.asset_manifest_hash || null,
                render_ready_source_hash: identity.render_ready_source_hash || null,
                renderer_source_hash: identity.renderer_source_tree_hash || null,
                total_frames: identity.total_frames,
                fps: identity.fps,
                frame_range: identity.selected_render_range
              },
              encode: { profile: 'review', width: Number(process.env.REVIEW_WIDTH), height: Number(process.env.REVIEW_HEIGHT), codec: 'h264', bitrate: process.env.REVIEW_BITRATE, crf: null, encoder_preset: null },
              artifact: {
                run_id: '${{ github.run_id }}',
                validated_by_run_id: process.env.VALIDATION_RUN_ID,
                video_path: 'out/orvyq_review.mp4',
                video_sha256: process.env.REVIEW_VIDEO_SHA256
              }
            };
            fs.writeFileSync('projects/$PROJECT_ID/qa/review_render_manifest.json', JSON.stringify(manifest, null, 2));
          "
          cat "projects/$PROJECT_ID/qa/review_render_manifest.json"

      - name: Upload official recovered review before QA
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-full-length-review-${{ github.run_id }}
          retention-days: 30
          path: |
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/orvyq_review.mp4
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/review_render_stdout.txt
          if-no-files-found: error

      - name: Upload exact render bundle for later approved final encode
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-render-bundle-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          path: |
            projects/${{ env.PROJECT_ID }}/qa/frozen_candidate.json
            projects/${{ env.PROJECT_ID }}/qa/review_render_manifest.json
            projects/${{ env.PROJECT_ID }}/direction/edit_plan.json
            projects/${{ env.PROJECT_ID }}/remotion/captions.json
            projects/${{ env.PROJECT_ID }}/assets/**
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/**
            !projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/node_modules
            !projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out
            !projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/.remotion

      - name: Verify speech in recovered review
        run: python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID" --media "projects/$PROJECT_ID/remotion/render_ready_project/out/orvyq_review.mp4" --output-name speech_transcript.json

      - name: Run post-render media QA
        run: |
          set +e
          node scripts/orvyq_media_qa.mjs --project-id "$PROJECT_ID" --video "projects/$PROJECT_ID/remotion/render_ready_project/out/orvyq_review.mp4" --report "projects/$PROJECT_ID/qa/orvyq_review_media_qa.json" > media-qa.log 2>&1
          echo $? > media-qa.status
          cat media-qa.log
          exit 0

      - name: Run near-black audit
        run: |
          set +e
          node scripts/orvyq_near_black_audit.mjs --project-id "$PROJECT_ID" --video "projects/$PROJECT_ID/remotion/render_ready_project/out/orvyq_review.mp4" > near-black.log 2>&1
          echo $? > near-black.status
          cat near-black.log
          exit 0

      - name: Create visual and mobile review sheets
        run: |
          set -euo pipefail
          VIDEO="projects/$PROJECT_ID/remotion/render_ready_project/out/orvyq_review.mp4"
          OUT="projects/$PROJECT_ID/remotion/render_ready_project/out"
          MOBILE_INTERVAL="$(python3 -c "print(max(0.1, $CANDIDATE_DURATION_SECONDS / 30))")"
          CONTACT_INTERVAL="$(python3 -c "print(max(0.1, $CANDIDATE_DURATION_SECONDS / 50))")"
          ffmpeg -hide_banner -nostats -y -i "$VIDEO" -vf "fps=1/${MOBILE_INTERVAL},scale=320:-1,tile=5x6" -frames:v 1 "$OUT/orvyq_mobile_review_sheet.jpg"
          ffmpeg -hide_banner -nostats -y -i "$VIDEO" -vf "fps=1/${CONTACT_INTERVAL},scale=640:-1,tile=5x10" -frames:v 1 "$OUT/orvyq_quality_control_contact_sheet.jpg"
          ffprobe -v error -show_format -show_streams -print_format json "$VIDEO" > "$OUT/orvyq_quality_control_probe.json"

      - name: Upload recovered review QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-review-qa-reports-${{ github.run_id }}
          retention-days: 30
          path: |
            projects/${{ env.PROJECT_ID }}/qa/*.json
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/*.jpg
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/*.json
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out/review_render_stdout.txt
            projects/${{ env.PROJECT_ID }}/assets/audio/final_mix.metadata.json
            projects/${{ env.PROJECT_ID }}/assets/music/approved_bed.provenance.json
            projects/${{ env.PROJECT_ID }}/remotion/captions.json
            projects/${{ env.PROJECT_ID }}/direction/edit_plan.json
            media-qa.log
            media-qa.status
            near-black.log
            near-black.status
          if-no-files-found: warn

      - name: Enforce post-render QA
        run: |
          test "$(cat media-qa.status)" = "0"
          test "$(cat near-black.status)" = "0"

      - name: Report successful recovered review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `Completed review MP4 from run ${process.env.SOURCE_REVIEW_RUN_ID} was recovered without re-rendering, fully QA-checked, and published as official review run ${context.runId}: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nFinal Encode remains blocked pending explicit human approval.`
            });
