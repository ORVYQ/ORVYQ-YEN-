name: ORVYQ Project 002 Recovery Status Probe

# One-shot status refresh after the repaired recovery workflow was dispatched.
on:
  push:
    branches: [agent/002-deep-sea-cold-war]
    paths:
      - ".github/workflows/orvyq-project002-recovery-status-probe.yml"

permissions:
  actions: read
  issues: write
  pull-requests: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report latest recovery run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'orvyq-project002-review-recovery.yml',
              branch: 'agent/002-deep-sea-cold-war',
              per_page: 5
            });
            const run = data.workflow_runs[0];
            if (!run) throw new Error('No Project 002 review recovery run found');
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const summary = jobs.data.jobs.map((job) => `${job.name}:${job.status}/${job.conclusion || 'none'}`).join(', ');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body: `Project 002 recovery status: run \`${run.id}\`, status=\`${run.status}\`, conclusion=\`${run.conclusion || 'none'}\`, source=\`${run.head_sha}\`, jobs=\`${summary}\`.`
            });
