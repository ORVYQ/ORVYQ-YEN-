name: ORVYQ Project 002 Candidate Validation Trigger

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - claude/orvyq-canonical-candidate-parity-bl7w0u
    paths:
      - ".github/workflows/orvyq-project002-candidate-validation-trigger.yml"
      - ".github/workflows/orvyq-candidate-validation.yml"
      - "scripts/orvyq_full_production_plan.mjs"
      - "templates/remotion/src/**"
      - "projects/002-the-new-war-beneath-the-ocean/assets/audio/final_voice.mp3"
      - "projects/002-the-new-war-beneath-the-ocean/assets/evidence/**"
      - "projects/002-the-new-war-beneath-the-ocean/assets/footage/**"
      - "projects/002-the-new-war-beneath-the-ocean/research/**"
      - "projects/002-the-new-war-beneath-the-ocean/direction/**"
      - "projects/002-the-new-war-beneath-the-ocean/config/**"
  push:
    branches:
      - agent/002-deep-sea-cold-war
    paths:
      - ".github/workflows/orvyq-project002-candidate-validation-trigger.yml"
      - ".github/workflows/orvyq-candidate-validation.yml"
      - "scripts/orvyq_full_production_plan.mjs"
      - "templates/remotion/src/**"
      - "projects/002-the-new-war-beneath-the-ocean/assets/audio/final_voice.mp3"
      - "projects/002-the-new-war-beneath-the-ocean/assets/evidence/**"
      - "projects/002-the-new-war-beneath-the-ocean/assets/footage/**"
      - "projects/002-the-new-war-beneath-the-ocean/research/**"
      - "projects/002-the-new-war-beneath-the-ocean/direction/**"
      - "projects/002-the-new-war-beneath-the-ocean/config/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-project002-candidate-validation-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation start on the active PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Project 002 Candidate Validation started: run \`$GITHUB_RUN_ID\`, source \`$SOURCE_SHA\`."

  validate:
    needs: announce
    uses: ./.github/workflows/orvyq-candidate-validation.yml
    with:
      project_id: 002-the-new-war-beneath-the-ocean
    secrets: inherit

  report:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record validation result on the active PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Project 002 Candidate Validation finished: run \`$GITHUB_RUN_ID\`, source \`$SOURCE_SHA\`, result=\`$VALIDATION_RESULT\`."
