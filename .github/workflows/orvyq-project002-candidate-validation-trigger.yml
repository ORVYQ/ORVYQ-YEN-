name: ORVYQ Project 002 Candidate Validation Trigger

on:
  workflow_dispatch:
  push:
    branches:
      - agent/002-deep-sea-cold-war
    paths:
      - ".github/workflows/orvyq-project002-candidate-validation-trigger.yml"
      - ".github/workflows/orvyq-candidate-validation.yml"
      - "scripts/orvyq_full_production_plan.mjs"
      - "templates/remotion/src/**"
      - "projects/002-the-new-war-beneath-the-ocean/assets/audio/final_voice.mp3"
      - "projects/002-the-new-war-beneath-the-ocean/assets/evidence/**"
      - "projects/002-the-new-war-beneath-the-ocean/assets/footage/**"
      - "projects/002-the-new-war-beneath-the-ocean/research/**"
      - "projects/002-the-new-war-beneath-the-ocean/direction/**"
      - "projects/002-the-new-war-beneath-the-ocean/config/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-project002-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Record validation start on the active PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Project 002 Candidate Validation started: run \`$GITHUB_RUN_ID\`, source \`$GITHUB_SHA\`."
          fi

  validate:
    needs: announce
    uses: ./.github/workflows/orvyq-candidate-validation.yml
    with:
      project_id: 002-the-new-war-beneath-the-ocean
    secrets: inherit

  report:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record validation result on the active PR
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Project 002 Candidate Validation finished: run \`$GITHUB_RUN_ID\`, source \`$GITHUB_SHA\`, result=\`$VALIDATION_RESULT\`."
          fi
