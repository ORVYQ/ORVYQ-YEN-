name: Inspect Candidate Validation 30376871334

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-candidate-30376871334.yml"

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract exact failing production-plan error
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run view 30376871334 --repo "${{ github.repository }}" --log > /tmp/run.log
          python - <<'PY' > /tmp/error.txt
          from pathlib import Path
          lines=Path('/tmp/run.log').read_text(errors='replace').splitlines()
          needles=('cannot shrink','"ok":false','unresolved creative-coverage','exceeds the','Error:','CliError:')
          hits=[line for line in lines if any(n in line for n in needles)]
          print('\n'.join(hits[-30:]) if hits else '\n'.join(lines[-120:]))
          PY
          body="$(cat /tmp/error.txt)"
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Candidate Validation run \`30376871334\` exact failure:\n\n\`\`\`text\n${body}\n\`\`\`"
