name: ORVYQ Project Footage Acquisition

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project directory id under projects/"
        type: string
        required: true
      target_branch:
        description: "Branch containing the project and acquisition plan"
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-project-footage-acquisition.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: orvyq-project-footage-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT_ID="${{ inputs.project_id }}"
            TARGET_BRANCH="${{ inputs.target_branch }}"
          else
            PROJECT_ID="002-the-new-war-beneath-the-ocean"
            TARGET_BRANCH="agent/002-deep-sea-cold-war"
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

      - name: Checkout target project branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: true
          fetch-depth: 20

      - name: Verify request and Pexels credential
        run: |
          set -euo pipefail
          test -n "$PEXELS_API_KEY" || { echo "::error::Repository secret PEXELS_API_KEY is missing."; exit 1; }
          test -f "projects/$PROJECT_ID/research/footage_acquisition_plan.json"
          test -f "scripts/orvyq_acquire_footage.mjs"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and media tools
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Acquire licensed contextual footage
        run: node scripts/orvyq_acquire_footage.mjs --project-id="$PROJECT_ID"

      - name: Validate downloaded clips and provenance
        run: node scripts/orvyq_materialize_footage.mjs --project-id="$PROJECT_ID"

      - name: Commit verified footage to the target branch in small batches
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$GITHUB_WORKSPACE/footage-commit.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          FOOTAGE_DIR="projects/$PROJECT_ID/assets/footage"
          FIRST_MEDIA="$(find "$FOOTAGE_DIR" -maxdepth 1 -type f -name '*.mp4' | sort | head -n 1)"
          test -n "$FIRST_MEDIA"

          git check-attr filter -- "$FIRST_MEDIA" | tee /tmp/footage-attribute.txt
          if grep -q 'filter: lfs' /tmp/footage-attribute.txt; then
            echo "::error::Compact project footage is still configured for Git LFS."
            exit 1
          fi

          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"

          push_current_head() {
            local attempt
            for attempt in 1 2 3; do
              if git push origin "HEAD:$TARGET_BRANCH"; then
                return 0
              fi
              echo "Push attempt $attempt failed; synchronising and retrying."
              git fetch origin "$TARGET_BRANCH"
              git rebase "origin/$TARGET_BRANCH"
              sleep $((attempt * 5))
            done
            echo "::error::Unable to push footage batch after three attempts."
            return 1
          }

          mapfile -t MEDIA_FILES < <(find "$FOOTAGE_DIR" -maxdepth 1 -type f -name '*.mp4' | sort)
          test "${#MEDIA_FILES[@]}" -gt 0

          BATCH_SIZE=4
          BATCH_NUMBER=0
          for ((START=0; START<${#MEDIA_FILES[@]}; START+=BATCH_SIZE)); do
            BATCH_NUMBER=$((BATCH_NUMBER + 1))
            END=$((START + BATCH_SIZE))
            if [ "$END" -gt "${#MEDIA_FILES[@]}" ]; then
              END="${#MEDIA_FILES[@]}"
            fi

            for ((INDEX=START; INDEX<END; INDEX++)); do
              MEDIA="${MEDIA_FILES[$INDEX]}"
              git add -f "$MEDIA" "$MEDIA.provenance.json"
            done

            if git diff --cached --quiet; then
              echo "Footage batch $BATCH_NUMBER is unchanged."
              continue
            fi

            git commit -m "Acquire compact footage batch $BATCH_NUMBER for $PROJECT_ID [skip ci]"
            push_current_head
          done

          git add -f \
            "projects/$PROJECT_ID/assets/local_assets.json" \
            "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" \
            "projects/$PROJECT_ID/qa/local_assets.provenance.json"

          if ! git diff --cached --quiet; then
            git commit -m "Record verified footage manifests for $PROJECT_ID [skip ci]"
            push_current_head
          fi

          echo "All compact footage batches and manifests were pushed successfully."

      - name: Upload acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-acquisition-${{ github.run_id }}
          retention-days: 14
          path: |
            footage-commit.log
            projects/${{ env.PROJECT_ID }}/research/footage_acquisition_plan.json
            projects/${{ env.PROJECT_ID }}/assets/footage_acquisition.runtime.json
            projects/${{ env.PROJECT_ID }}/assets/local_assets.json
            projects/${{ env.PROJECT_ID }}/assets/footage/*.provenance.json
            projects/${{ env.PROJECT_ID }}/qa/local_assets.provenance.json
          if-no-files-found: warn

      - name: Report acquisition result to Project 002 PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 footage acquisition finished with **${JOB_STATUS}**. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Target: \`${PROJECT_ID}\` on \`${TARGET_BRANCH}\`. Commit diagnostics are attached to the run artifact."

# Retry 6: force-add only verified generated assets that are intentionally ignored by repository policy.
