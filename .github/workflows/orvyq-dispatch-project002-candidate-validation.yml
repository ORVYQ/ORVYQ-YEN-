name: Dispatch Project 002 Candidate Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-dispatch-project002-candidate-validation.yml"

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch candidate validation on Project 002 branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean

      - name: Report dispatch to Project 002 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched on branch head \`5b1937a\` after removing the infeasible CLM_015 slice 34 recap compression. The shot keeps its natural duration; no footage, evidence, semantic placement or quality threshold was weakened."

