name: ORVYQ Project 002 Restore CLM004 Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-project002-restore-clm004-evidence.yml"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  restore-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - name: Restore a real JAMSTEC evidence slice
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json')
          plan = json.loads(path.read_text())
          claim = 'CLM_004_JAPAN_INDUSTRIAL_TIMELINE'
          breaks = plan.get('graphic_break_assignments', {}).get(claim, {})

          # Slice 1 was an illustrative recap card between two footage beats.
          # Removing only this card lets the existing sequence_plan override
          # materialize JAMSTEC's real 2027 trial/system figures at this exact
          # claim, restoring physical source-backed evidence without reducing
          # the 15-second evidence-run cap or weakening any audit.
          removed = breaks.pop('1', None)
          if removed is None:
              raise SystemExit('Expected CLM_004 graphic break at slice 1 was not present')

          plan['generation_policy'] = (
              'evidence-claim opening context; every additional footage/graphic break hand-authored from real, '
              'frame-verified clip content matched to the claim meaning; CLM_004 preserves at least one real '
              'JAMSTEC official-figure slice; no index-based assignment, no artificial span stretching; '
              '15s uninterrupted-evidence cap preserved'
          )
          path.write_text(json.dumps(plan, indent=2) + '\n')
          PY

      - name: Commit authored evidence restoration
        run: |
          set -euo pipefail
          git config user.name "orvyq-evidence-editor"
          git config user.email "orvyq-evidence-editor@users.noreply.github.com"
          git add projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          git commit -m "Restore physical JAMSTEC evidence for CLM004"
          git pull --rebase origin agent/002-deep-sea-cold-war
          git push origin HEAD:agent/002-deep-sea-cold-war

      - name: Re-dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run orvyq-candidate-validation.yml \
            --repo "${{ github.repository }}" \
            --ref agent/002-deep-sea-cold-war \
            -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments \
            -f body="Project 002 Candidate Validation re-dispatched after restoring a real JAMSTEC official-figure evidence slice for CLM_004_JAPAN_INDUSTRIAL_TIMELINE. No quality threshold was weakened."
