name: ORVYQ Transfer DNS Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-transfer-dns-probe.yml"

permissions:
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Figma upload host
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPS="$(getent ahostsv4 mcp.figma.com | awk '{print $1}' | sort -u | paste -sd, -)"
          test -n "$IPS"
          gh api repos/${{ github.repository }}/issues/3/comments -f body="ORVYQ transfer DNS probe: \`mcp.figma.com\` IPv4 = \`$IPS\`."
