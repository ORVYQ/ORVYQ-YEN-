name: Inspect Candidate Validation 30349530672

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-run-30349530672.yml"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact failing-step diagnostics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api repos/${{ github.repository }}/actions/jobs/90243513222/logs > /tmp/job.log
          awk '/Build the canonical full production shot list from real data/{capture=1} capture{print} /Report real footage clip durations/{exit}' /tmp/job.log > diagnostics/candidate-validation-30349530672.log
          tail -n 220 diagnostics/candidate-validation-30349530672.log > /tmp/tail.log
          body="$(printf 'Candidate Validation run `30349530672`, job `90243513222` exact failing-step diagnostics:\n\n```text\n'; cat /tmp/tail.log; printf '\n```')"
          gh api repos/${{ github.repository }}/issues/3/comments -f body="$body"
          git config user.name "orvyq-inspector"
          git config user.email "orvyq-inspector@users.noreply.github.com"
          git add diagnostics/candidate-validation-30349530672.log
          git commit -m "Record Candidate Validation 30349530672 failure [skip ci]" || exit 0
          git push origin HEAD:main

