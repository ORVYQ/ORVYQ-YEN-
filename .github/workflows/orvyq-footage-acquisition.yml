name: ORVYQ Footage Acquisition

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project directory id under projects/"
        type: string
        required: true
  push:
    branches:
      - "agent/**"
      - "claude/**"
    paths:
      - ".github/workflows/orvyq-footage-acquisition.yml"
      - "scripts/orvyq_acquire_footage.mjs"
      - "scripts/orvyq_acquire_footage_demand.mjs"
      - "scripts/orvyq_fail_closed_pending_footage.mjs"
      - "scripts/orvyq_full_production_plan.mjs"
      - "scripts/orvyq_generate_footage_contact_sheets.mjs"
      - "scripts/orvyq_prepare_footage_review_queue.mjs"
      - "projects/*/research/footage_acquisition_plan.json"
      - "projects/*/research/footage_semantic_constraints.json"
      - "projects/*/research/footage_constraint_overrides.json"
      - "projects/*/research/footage_visual_decisions.json"
      - "projects/*/research/visual_asset_requests.json"
      - "projects/*/research/visual_asset_reviews.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/orvyq-footage-acquisition.yml"
      - "scripts/orvyq_acquire_footage.mjs"
      - "scripts/orvyq_acquire_footage_demand.mjs"
      - "scripts/orvyq_fail_closed_pending_footage.mjs"
      - "scripts/orvyq_full_production_plan.mjs"
      - "scripts/orvyq_generate_footage_contact_sheets.mjs"
      - "scripts/orvyq_prepare_footage_review_queue.mjs"
      - "projects/*/research/footage_acquisition_plan.json"
      - "projects/*/research/footage_semantic_constraints.json"
      - "projects/*/research/footage_constraint_overrides.json"
      - "projects/*/research/footage_visual_decisions.json"
      - "projects/*/research/visual_asset_requests.json"
      - "projects/*/research/visual_asset_reviews.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: orvyq-footage-acquisition-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false
          fetch-depth: 2

      - name: Resolve selected project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT_ID="${{ inputs.project_id }}"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              CHANGED_INPUT="$(
                git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
                  grep -E '^projects/[^/]+/research/(footage_acquisition_plan|footage_semantic_constraints|footage_constraint_overrides|footage_visual_decisions|visual_asset_requests|visual_asset_reviews)\.json$' |
                  head -n 1 || true
              )"
            else
              CHANGED_INPUT=""
            fi
            if [ -n "$CHANGED_INPUT" ]; then
              PROJECT_ID="$(jq -r '.project_id' "$CHANGED_INPUT")"
              if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
                echo "::error::Changed footage input $CHANGED_INPUT does not declare a valid project_id."
                exit 1
              fi
            else
              mapfile -t CANDIDATES < <(
                find projects -path '*/research/footage_acquisition_plan.json' -type f -print0 |
                  while IFS= read -r -d '' plan; do
                    root="${plan%/research/footage_acquisition_plan.json}"
                    runtime="$root/assets/footage_acquisition.runtime.json"
                    reviews="$root/research/visual_asset_reviews.json"
                    planned="$(jq '.assets | length' "$plan")"
                    actual="$(test -f "$runtime" && jq '.records | length' "$runtime" || echo 0)"
                    pending="$(test -f "$reviews" && jq '.pending_frame_review_scene_ids | length' "$reviews" || echo 0)"
                    if [ "$actual" -lt "$planned" ] || [ "$pending" -gt 0 ]; then jq -r '.project_id' "$plan"; fi
                  done | sort -u
              )
              if [ "${#CANDIDATES[@]}" -ne 1 ]; then
                echo "::error::Could not resolve exactly one project needing footage acquisition or semantic revalidation; found ${#CANDIDATES[@]}."
                exit 1
              fi
              PROJECT_ID="${CANDIDATES[0]}"
            fi
          fi
          test -f "projects/$PROJECT_ID/research/footage_acquisition_plan.json"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Resolved project: $PROJECT_ID"

      - name: Determine acquisition or review-only mode
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/$PROJECT_ID"
          PLAN="$ROOT/research/footage_acquisition_plan.json"
          RUNTIME="$ROOT/assets/footage_acquisition.runtime.json"
          CONTACTS="$ROOT/qa/footage_contact_sheets.json"
          DECISIONS="$ROOT/research/footage_visual_decisions.json"
          PLANNED="$(jq '.assets | length' "$PLAN")"
          ACTUAL="$(test -f "$RUNTIME" && jq '.records | length' "$RUNTIME" || echo 0)"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "$CONTACTS" ] && [ "$ACTUAL" -eq "$PLANNED" ] && [ ! -f "$DECISIONS" ]; then
            echo "REVIEW_ONLY=true" >> "$GITHUB_ENV"
            echo "Existing complete footage pool detected; regenerating blueprint/review queue without reacquisition."
          else
            echo "REVIEW_ONLY=false" >> "$GITHUB_ENV"
            echo "Acquisition/reacquisition mode selected."
          fi

      - name: Apply project-authored footage constraint overrides
        if: env.REVIEW_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="projects/$PROJECT_ID/research/footage_semantic_constraints.json"
          OVERRIDE="projects/$PROJECT_ID/research/footage_constraint_overrides.json"
          if [ ! -f "$OVERRIDE" ]; then
            echo "No project-authored footage constraint overrides."
            exit 0
          fi
          test "$(jq -r '.project_id' "$OVERRIDE")" = "$PROJECT_ID"
          jq --slurpfile override "$OVERRIDE" '.scenes = (.scenes * $override[0].scenes) | .request_revision = ((.request_revision // 0) + 1)' "$BASE" > "$BASE.tmp"
          mv "$BASE.tmp" "$BASE"

      - name: Verify Pexels credential exists
        if: env.REVIEW_ONLY != 'true'
        run: |
          set -euo pipefail
          test -n "$PEXELS_API_KEY" || { echo "::error::Repository secret PEXELS_API_KEY is missing."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install media probe
        if: env.REVIEW_ONLY != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Acquire missing licensed contextual footage and resolve editorial targets
        if: env.REVIEW_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/orvyq_acquire_footage_demand.mjs --project-id="$PROJECT_ID" 2>&1 | tee footage-acquisition.log

      - name: Fail closed every pending footage approval
        if: env.REVIEW_ONLY != 'true'
        run: node scripts/orvyq_fail_closed_pending_footage.mjs --project-id="$PROJECT_ID"

      - name: Generate byte-bound footage contact sheets
        if: env.REVIEW_ONLY != 'true'
        run: node scripts/orvyq_generate_footage_contact_sheets.mjs --project-id="$PROJECT_ID"

      - name: Regenerate full-production blueprint from current asset assignments
        run: node scripts/orvyq_full_production_plan.mjs --project-id="$PROJECT_ID"

      - name: Build claim-bound footage review queue
        run: node scripts/orvyq_prepare_footage_review_queue.mjs --project-id="$PROJECT_ID"

      - name: Verify compact footage is stored as normal Git media
        if: env.REVIEW_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' media; do
            attr="$(git check-attr filter -- "$media")"
            if grep -q 'filter: lfs$' <<<"$attr"; then
              echo "::error::$media is still routed through Git LFS: $attr"
              exit 1
            fi
            bytes="$(stat -c '%s' "$media")"
            if [ "$bytes" -ge 95000000 ]; then
              echo "::error::$media is $bytes bytes; compact normal-Git footage must stay below 95 MB."
              exit 1
            fi
          done < <(find "projects/$PROJECT_ID/assets/footage" -maxdepth 1 -type f -name '*.mp4' -print0)

      - name: Commit footage state, regenerated blueprint and review queue
        shell: bash
        run: |
          set -euo pipefail
          git add -f \
            "projects/$PROJECT_ID/assets/footage" \
            "projects/$PROJECT_ID/assets/local_assets.json" \
            "projects/$PROJECT_ID/assets/footage_acquisition.runtime.json" \
            "projects/$PROJECT_ID/qa/local_assets.provenance.json" \
            "projects/$PROJECT_ID/qa/footage-contact-sheets" \
            "projects/$PROJECT_ID/qa/footage_contact_sheets.json" \
            "projects/$PROJECT_ID/qa/footage_review_queue.json"
          git add \
            "projects/$PROJECT_ID/research/footage_acquisition_plan.json" \
            "projects/$PROJECT_ID/research/footage_semantic_constraints.json" \
            "projects/$PROJECT_ID/research/footage_constraint_overrides.json" \
            "projects/$PROJECT_ID/research/visual_asset_requests.json" \
            "projects/$PROJECT_ID/research/visual_asset_reviews.json" \
            "projects/$PROJECT_ID/config/editorial_asset_plan.json" \
            "projects/$PROJECT_ID/direction/editorial_blueprint.json" \
            "projects/$PROJECT_ID/direction/editorial_pause_map.json"
          git config user.name "orvyq-footage-bot"
          git config user.email "orvyq-footage-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Footage state and review queue unchanged; nothing to commit."
            exit 0
          fi
          if [ "$REVIEW_ONLY" = "true" ]; then
            git commit -m "Regenerate claim-bound footage review queue"
          else
            git commit -m "Acquire demand-led licensed footage for $PROJECT_ID"
          fi
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload acquisition and review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-footage-review-${{ steps.project.outputs.project_id }}-${{ github.run_id }}
          retention-days: 30
          path: |
            footage-acquisition.log
            projects/${{ steps.project.outputs.project_id }}/research/footage_acquisition_plan.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_semantic_constraints.json
            projects/${{ steps.project.outputs.project_id }}/research/footage_constraint_overrides.json
            projects/${{ steps.project.outputs.project_id }}/research/visual_asset_requests.json
            projects/${{ steps.project.outputs.project_id }}/research/visual_asset_reviews.json
            projects/${{ steps.project.outputs.project_id }}/config/editorial_asset_plan.json
            projects/${{ steps.project.outputs.project_id }}/direction/editorial_blueprint.json
            projects/${{ steps.project.outputs.project_id }}/assets/footage_acquisition.runtime.json
            projects/${{ steps.project.outputs.project_id }}/assets/local_assets.json
            projects/${{ steps.project.outputs.project_id }}/assets/footage/*.provenance.json
            projects/${{ steps.project.outputs.project_id }}/qa/local_assets.provenance.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage_contact_sheets.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage_review_queue.json
            projects/${{ steps.project.outputs.project_id }}/qa/footage-contact-sheets/*.jpg
          if-no-files-found: warn

      - name: Report acquisition result on the active pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          PROJECT_LABEL="${PROJECT_ID:-unresolved}"
          DETAILS="$(tail -n 20 footage-acquisition.log 2>/dev/null || true)"
          BODY="Footage preparation finished with **${JOB_STATUS}**. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Target: \`${PROJECT_LABEL}\` on \`${TARGET_BRANCH}\`. Mode: \`${REVIEW_ONLY:-unknown}\`."
          if [ -n "$DETAILS" ]; then
            BODY="${BODY}"$'\n\n```text\n'"${DETAILS}"$'\n```'
          fi
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" ||
              echo "::warning::Could not post the footage preparation result to PR #$PR_NUMBER; the uploaded diagnostics remain authoritative."
          else
            echo "No active pull request found for $TARGET_BRANCH; skipping PR report."
          fi
