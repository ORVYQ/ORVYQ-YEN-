name: Inspect ORVYQ Candidate Validation Error

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-candidate-validation-error.yml"

permissions:
  actions: read
  contents: write

jobs:
  inspect-error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest validation failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          run_id="30322442450"
          jobs="$(gh api "repos/$repo/actions/runs/$run_id/jobs")"
          job_id="$(printf '%s' "$jobs" | jq -r '.jobs[0].id')"
          gh api "repos/$repo/actions/jobs/$job_id/logs" > job.log
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('job.log').read_text(errors='replace')
          gaps=re.findall(r'- Uninterrupted evidence run of .*?(?=\\n- |"}\s*$|\n##\[error\])', text, flags=re.S)
          cleaned=[]
          for gap in gaps:
              gap=gap.replace('\\n','\n')
              gap=re.sub(r'^\d{4}-\d{2}-\d{2}T[^Z]+Z\s*','',gap)
              cleaned.append(gap.strip())
          out='run_id=30322442450\njob_id=90160942981\ncoverage_gap_count='+str(len(cleaned))+'\n\n'+'\n'.join(cleaned)
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/latest-coverage-gaps.txt').write_text(out[:50000])
          PY
          git config user.name "orvyq-diagnostics-bot"
          git config user.email "orvyq-diagnostics-bot@users.noreply.github.com"
          git add diagnostics/latest-coverage-gaps.txt
          git commit -m "Record complete Project 002 coverage gaps [skip ci]" || exit 0
          git push origin HEAD:main
