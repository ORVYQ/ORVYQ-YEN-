name: Inspect ORVYQ Candidate Validation Error

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-inspect-candidate-validation-error.yml"

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  inspect-error:
    runs-on: ubuntu-latest
    steps:
      - name: Extract latest validation failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          run_id="30246825065"
          jobs="$(gh api "repos/$repo/actions/runs/$run_id/jobs")"
          job_id="$(printf '%s' "$jobs" | jq -r '.jobs[0].id')"
          gh api "repos/$repo/actions/jobs/$job_id/logs" > job.log
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('job.log').read_text(errors='replace').splitlines()
          target='Build the canonical full production shot list from real data'
          hits=[i for i,l in enumerate(lines) if target.lower() in l.lower()]
          if hits:
              start=hits[-1]
              selected=lines[start:min(len(lines),start+240)]
          else:
              errs=[i for i,l in enumerate(lines) if '##[error]' in l.lower() or '{"ok":false' in l.lower()]
              idx=errs[-1] if errs else len(lines)-1
              selected=lines[max(0,idx-100):min(len(lines),idx+100)]
          cleaned=[]
          for line in selected:
              line=re.sub(r'^\d{4}-\d{2}-\d{2}T[^Z]+Z\s*','',line)
              cleaned.append(line[:1200])
          Path('excerpt.txt').write_text('\n'.join(cleaned)[:24000])
          PY
          excerpt="$(cat excerpt.txt)"
          body=$(printf 'Project 002 latest full-production diagnostics for run `%s`, job `%s`:\n\n```text\n%s\n```' "$run_id" "$job_id" "$excerpt")
          gh api "repos/$repo/issues/3/comments" -f body="$body"

# Trigger revision: inspect full-production failure for run 30246825065.
