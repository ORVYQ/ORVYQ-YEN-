name: ORVYQ One-Shot Structural Card Fix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/orvyq-one-shot-structural-card-fix.yml"
  push:
    branches:
      - agent/002-deep-sea-cold-war
    paths:
      - ".github/workflows/orvyq-one-shot-structural-card-fix.yml"

permissions:
  contents: write

concurrency:
  group: orvyq-one-shot-structural-card-fix
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Apply structural section-title fix
        run: |
          python3 scripts/orvyq_one_shot_structural_card_fix.py
          ! grep -q '"maxSeconds"' projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          node -e 'JSON.parse(require("node:fs").readFileSync("projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json", "utf8"))'

      - name: Run unit tests
        run: npm test

      - name: Commit the verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/orvyq_full_production_plan.mjs templates/remotion/src/Scene.tsx projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          git diff --cached --check
          git commit -m "Replace repeated section cards with evidence-backed title overlays"
          git pull --rebase origin agent/002-deep-sea-cold-war
          git push origin HEAD:agent/002-deep-sea-cold-war
