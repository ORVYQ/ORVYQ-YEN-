name: Materialize Project 002 Editorial Plan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-materialize-project002-editorial-plan.yml"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate evidence-led editorial asset plan
        run: |
          set -euo pipefail
          npm ci
          node scripts/orvyq_seed_editorial_asset_plan.mjs --project-id=002-the-new-war-beneath-the-ocean
          cat projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json

      - name: Commit the materialized plan
        run: |
          set -euo pipefail
          git config user.name "orvyq-editorial-bot"
          git config user.email "orvyq-editorial-bot@users.noreply.github.com"
          git add -f projects/002-the-new-war-beneath-the-ocean/config/editorial_asset_plan.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Project 002 editorial asset plan [skip ci]"
            git pull --rebase origin agent/002-deep-sea-cold-war
            git push origin HEAD:agent/002-deep-sea-cold-war
          fi

      - name: Dispatch Candidate Validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run orvyq-candidate-validation.yml --repo "${{ github.repository }}" --ref agent/002-deep-sea-cold-war -f project_id=002-the-new-war-beneath-the-ocean
          gh api repos/${{ github.repository }}/issues/3/comments -f body="Project 002 Candidate Validation re-dispatched after materializing the evidence-led editorial asset plan from the verified 20-clip catalog."
