name: ORVYQ Apply Fundamental Fixes

on:
  push:
    branches:
      - claude/orvyq-canonical-candidate-parity-bl7w0u
    paths:
      - .github/workflows/orvyq-apply-fundamental-fixes.yml

permissions:
  contents: write
  issues: write

jobs:
  wire-pipeline:
    if: ${{ !contains(github.event.head_commit.message, '[fundamental-fixes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: claude/orvyq-canonical-candidate-parity-bl7w0u
          fetch-depth: 0

      - name: Wire creative polish and dynamic remix into Candidate Validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/orvyq-candidate-validation.yml')
          text = workflow.read_text()
          edit_old = '        run: node scripts/orvyq_edit_plan.mjs --project-id="$PROJECT_ID" --mode=full'
          edit_new = '''        run: |
                  node scripts/orvyq_edit_plan.mjs --project-id="$PROJECT_ID" --mode=full
                  node scripts/orvyq_creative_polish.mjs --project-id="$PROJECT_ID"'''.replace('              ', '      ')
          audio_old = '        run: node scripts/orvyq_audio_mix.mjs --project-id="$PROJECT_ID" --mode=candidate --duration-seconds="$CANDIDATE_DURATION_SECONDS" --head-silence-seconds="$HOOK_DURATION_SECONDS"'
          audio_new = '''        run: |
                  node scripts/orvyq_audio_mix.mjs --project-id="$PROJECT_ID" --mode=candidate --duration-seconds="$CANDIDATE_DURATION_SECONDS" --head-silence-seconds="$HOOK_DURATION_SECONDS"
                  node scripts/orvyq_dynamic_remix.mjs --project-id="$PROJECT_ID"'''.replace('              ', '      ')
          if edit_old not in text:
              raise SystemExit('Candidate Validation edit-plan command was not found or is already changed unexpectedly')
          if audio_old not in text:
              raise SystemExit('Candidate Validation audio command was not found or is already changed unexpectedly')
          text = text.replace(edit_old, edit_new, 1).replace(audio_old, audio_new, 1)
          workflow.write_text(text)
          PY
          node --check scripts/orvyq_creative_polish.mjs
          node --check scripts/orvyq_dynamic_remix.mjs
          node --test scripts/orvyq_creative_polish.test.mjs scripts/orvyq_dynamic_remix.test.mjs
          rm -f .github/workflows/orvyq-apply-fundamental-fixes.yml

      - name: Commit pipeline wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORVYQ Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/orvyq-candidate-validation.yml .github/workflows/orvyq-apply-fundamental-fixes.yml
          git commit -m "Wire fundamental review fixes into validation [fundamental-fixes-applied]"
          git push origin HEAD:claude/orvyq-canonical-candidate-parity-bl7w0u

      - name: Report pipeline wiring
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/ORVYQ/ORVYQ-YEN-/issues/1/comments -f body="Fundamental review fixes are wired into Candidate Validation at commit $(git rev-parse HEAD). Creative footage polish, cinematic evidence layouts, mobile typography and dynamic remix are now mandatory pre-render steps. No review or Final Encode was started."
