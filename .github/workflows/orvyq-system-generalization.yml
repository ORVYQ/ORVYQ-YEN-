name: ORVYQ System Generalization Migration

# One-time deterministic source/data migration. It does not render video,
# fetch media, or change creative output. It only moves existing project data
# out of shared runtime code and removes silent project fallbacks.
on:
  pull_request:
    branches:
      - "claude/orvyq-assets-soundtrack-port-noz6bi"
    paths:
      - "scripts/migrations/generalize-system-runtime.mjs"
      - ".github/workflows/orvyq-system-generalization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orvyq-system-generalization-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Move project data out of shared runtime code
        run: |
          set +e
          node scripts/migrations/generalize-system-runtime.mjs 2>&1 | tee migration.log
          echo ${PIPESTATUS[0]} > migration.status
          exit 0

      - name: Syntax-check migrated JavaScript
        if: always()
        run: |
          set +e
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check 2>&1 | tee syntax.log
          echo ${PIPESTATUS[0]} > syntax.status
          exit 0

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-system-generalization-${{ github.run_id }}
          retention-days: 7
          path: |
            migration.log
            migration.status
            syntax.log
            syntax.status
            scripts/orvyq_full_production_plan.mjs
            scripts/orvyq_edit_plan.mjs
            projects/*/config/editorial_asset_plan.json
          if-no-files-found: warn

      - name: Stop on migration or syntax failure
        run: |
          set -euo pipefail
          test "$(cat migration.status)" = "0"
          test "$(cat syntax.status)" = "0"

      - name: Commit deterministic migration
        run: |
          set -euo pipefail
          git config user.name "orvyq-system-migration-bot"
          git config user.email "orvyq-system-migration-bot@users.noreply.github.com"
          git add scripts/ projects/*/config/editorial_asset_plan.json
          if git diff --cached --quiet; then
            echo "Migration already applied"
            exit 0
          fi
          git commit -m "Generalize ORVYQ runtime across projects"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
