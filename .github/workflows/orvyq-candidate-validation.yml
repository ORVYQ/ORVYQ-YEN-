name: ORVYQ Candidate Validation

# Builds and validates one explicitly selected project without rendering video.
# No repository branch, project id, asset, or creative choice is implicit.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project directory id under projects/ (for example 002-my-film)"
        type: string
        required: true
  workflow_call:
    inputs:
      project_id:
        description: "Project directory id under projects/"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: orvyq-candidate-validation-${{ inputs.project_id }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ inputs.project_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lock exact source commit
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA"
          printf '%s\n' "$ACTUAL_SHA" | tee validation-source-sha.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Validate selected project and production profile
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import { loadProductionPolicy } from './scripts/lib/orvyq-project-profile.mjs';
            const policy = await loadProductionPolicy(process.env.PROJECT_ID);
            console.log(JSON.stringify({ project_id: policy.project.project_id, profile: policy.project.creative_profile, status: policy.project.status }, null, 2));
          "

      - name: Validate repository-local footage and provenance
        run: node scripts/orvyq_materialize_footage.mjs --project-id="$PROJECT_ID"

      - name: Verify narration was not overwritten by footage materialization
        run: test -s "projects/$PROJECT_ID/assets/audio/final_voice.mp3"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media, PDF and speech tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
          python -m pip install --disable-pip-version-check faster-whisper==1.2.0 requests==2.32.5

      - name: Run the unit test suite
        run: npm test

      - name: Resolve the canonical editorial pause plan
        run: node scripts/orvyq_resolve_pauses.mjs --project-id="$PROJECT_ID"

      - name: Build the canonical full production shot list from real data
        run: node scripts/orvyq_full_production_plan.mjs --project-id="$PROJECT_ID"

      - name: Validate canonical schemas and recovered project data
        run: npm run validate:canonical

      - name: Fetch and verify official primary evidence
        run: node scripts/orvyq_fetch_primary_evidence.mjs --project-id="$PROJECT_ID"

      - name: Promote verified evidence assets to ready
        run: node scripts/orvyq_promote_evidence_assets.mjs --project-id="$PROJECT_ID"

      - name: Report real footage clip durations
        if: always()
        run: node scripts/orvyq_footage_duration_report.mjs --project-id="$PROJECT_ID" | tee "projects/$PROJECT_ID/qa/footage_duration_report.json"

      - name: Build the canonical candidate edit plan
        run: node scripts/orvyq_edit_plan.mjs --project-id="$PROJECT_ID" --mode=full

      - name: Apply project-authored creative polish
        run: node scripts/orvyq_creative_polish.mjs --project-id="$PROJECT_ID"

      - name: Resolve the canonical candidate duration
        run: |
          set -euo pipefail
          node -e "
            const p = require('./projects/$PROJECT_ID/direction/edit_plan.json');
            const motionHook = require('./projects/$PROJECT_ID/direction/motion_hook.json');
            const hookDuration = motionHook.shots.reduce((s, x) => s + x.duration, 0);
            console.log('CANDIDATE_DURATION_SECONDS=' + (p.duration_frames / p.fps));
            console.log('HOOK_DURATION_SECONDS=' + hookDuration);
          " | tee -a "$GITHUB_ENV"

      - name: Resolve canonical music
        run: node scripts/orvyq_music_resolve.mjs --project-id="$PROJECT_ID" --mode=full --target-duration-seconds="$CANDIDATE_DURATION_SECONDS"

      - name: Build the full candidate narration and music mix
        run: node scripts/orvyq_audio_mix.mjs --project-id="$PROJECT_ID" --mode=candidate --duration-seconds="$CANDIDATE_DURATION_SECONDS" --head-silence-seconds="$HOOK_DURATION_SECONDS"

      - name: Verify narration and capture diagnostics
        run: |
          set +e
          python scripts/orvyq_speech_qa.py --project-id "$PROJECT_ID" > narration-qa.log 2>&1
          echo $? > narration-qa.status
          cat narration-qa.log
          exit 0

      - name: Stop when narration verification failed
        run: test "$(cat narration-qa.status)" = "0"

      - name: Build canonical captions
        run: node scripts/orvyq_caption_build.mjs --project-id="$PROJECT_ID"

      - name: Build canonical asset registry
        run: node scripts/orvyq_asset_registry.mjs --project-id="$PROJECT_ID"

      - name: Build render-ready project
        run: node scripts/orvyq_pipeline_cli.mjs build-render-project --project-id="$PROJECT_ID"

      - name: Install Remotion dependencies and type-check
        working-directory: projects/${{ env.PROJECT_ID }}/remotion/render_ready_project
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Compute frozen candidate manifest
        run: |
          node scripts/orvyq_frozen_candidate.mjs --project-id="$PROJECT_ID"
          cat "projects/$PROJECT_ID/qa/frozen_candidate.json"

      - name: Upload immutable validated candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-validated-candidate-${{ inputs.project_id }}-${{ github.run_id }}
          retention-days: 90
          include-hidden-files: true
          path: |
            validation-source-sha.txt
            projects/${{ env.PROJECT_ID }}/qa/frozen_candidate.json
            projects/${{ env.PROJECT_ID }}/config/production_profile.json
            projects/${{ env.PROJECT_ID }}/direction/edit_plan.json
            projects/${{ env.PROJECT_ID }}/remotion/captions.json
            projects/${{ env.PROJECT_ID }}/assets/**
            projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/**
            !projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/node_modules
            !projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/out
            !projects/${{ env.PROJECT_ID }}/remotion/render_ready_project/.remotion

      - name: Run full pre-render QA chain
        run: |
          set +e
          npm run orvyq:qa -- --project-id="$PROJECT_ID" > qa-chain.log 2>&1
          echo $? > qa-chain.status
          cat qa-chain.log
          exit 0

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-candidate-validation-${{ inputs.project_id }}-${{ github.run_id }}
          retention-days: 30
          path: |
            validation-source-sha.txt
            narration-qa.log
            narration-qa.status
            qa-chain.log
            qa-chain.status
            projects/${{ env.PROJECT_ID }}/qa/*.json
            projects/${{ env.PROJECT_ID }}/config/production_profile.json
            projects/${{ env.PROJECT_ID }}/direction/edit_plan.json
            projects/${{ env.PROJECT_ID }}/remotion/captions.json
            projects/${{ env.PROJECT_ID }}/assets/asset_registry.json
            projects/${{ env.PROJECT_ID }}/assets/audio/final_mix.metadata.json
            projects/${{ env.PROJECT_ID }}/assets/music/approved_bed.provenance.json
          if-no-files-found: warn

      - name: Stop when the pre-render QA chain failed
        run: test "$(cat qa-chain.status)" = "0"
