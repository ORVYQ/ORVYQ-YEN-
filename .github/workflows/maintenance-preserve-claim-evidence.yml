name: Preserve Claim Evidence Invariant

on:
  push:
    branches:
      - agent/systemic-visual-evidence-balance
    paths:
      - .github/workflows/maintenance-preserve-claim-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/systemic-visual-evidence-balance
          fetch-depth: 0

      - name: Patch generic rebalance evidence floor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/orvyq-visual-rebalance.mjs')
          text = path.read_text()

          needle = '''function unique(values) {
            return [...new Set(values.filter((value) => typeof value === "string" && value.trim()).map((value) => value.trim()))];
          }

          function requireReadyRequest(requests, action) {'''
          replacement = '''function unique(values) {
            return [...new Set(values.filter((value) => typeof value === "string" && value.trim()).map((value) => value.trim()))];
          }

          function sourceIdsForShot(shot) {
            return unique([...(shot.evidence?.source_ids || []), ...(shot.editorial_overlay?.source_ids || [])]);
          }

          function isSourceBackedEvidenceShot(shot) {
            if (shot.asset_type === "evidence") return sourceIdsForShot(shot).length > 0;
            return shot.asset_type === "graphic" && shot.source_derived === true && sourceIdsForShot(shot).length > 0;
          }

          function actionLeavesSourceBackedEvidence(shot, action) {
            if (!action) return isSourceBackedEvidenceShot(shot);
            if (action.decision === "replace_primary_evidence") return true;
            if (action.decision === "replace_contextual_footage" || action.decision === "remove") return false;
            return isSourceBackedEvidenceShot(shot);
          }

          // Rebalancing may reduce cards and source-derived graphics, but it may
          // never erase the final source-backed visual for a claim. When a plan
          // would do so, retain the shortest affected baseline evidence beat.
          // This minimizes presentation time while preserving claim provenance.
          function protectedClaimEvidenceIndices(shots, actions) {
            const indicesByClaim = new Map();
            shots.forEach((shot, index) => {
              if (!shot.claim_id) return;
              const indices = indicesByClaim.get(shot.claim_id) || [];
              indices.push(index);
              indicesByClaim.set(shot.claim_id, indices);
            });

            const protectedIndices = new Set();
            for (const indices of indicesByClaim.values()) {
              const baselineEvidence = indices.filter((index) => isSourceBackedEvidenceShot(shots[index]));
              if (!baselineEvidence.length) continue;
              if (indices.some((index) => actionLeavesSourceBackedEvidence(shots[index], actions.get(index)))) continue;

              const candidate = baselineEvidence
                .filter((index) => {
                  const action = actions.get(index);
                  return action && (action.decision === "replace_contextual_footage" || action.decision === "remove");
                })
                .sort((left, right) => Number(shots[left].duration) - Number(shots[right].duration) || left - right)[0];
              if (Number.isInteger(candidate)) protectedIndices.add(candidate);
            }
            return protectedIndices;
          }

          function requireReadyRequest(requests, action) {'''
          if text.count(needle) != 1:
            raise SystemExit('unique/requireReadyRequest insertion point changed')
          text = text.replace(needle, replacement)

          needle = '''  const output = clone(shots || []);

            for (let index = 0; index < output.length; index += 1) {'''
          replacement = '''  const output = clone(shots || []);
            const protectedEvidenceIndices = protectedClaimEvidenceIndices(output, actions);

            for (let index = 0; index < output.length; index += 1) {'''
          if text.count(needle) != 1:
            raise SystemExit('materialization loop insertion point changed')
          text = text.replace(needle, replacement)

          needle = '''    if (action.claim_id !== output[index].claim_id) {
                throw new Error(`shot ${index} claim drift blocks rebalance materialization`);
              }
              if (action.decision === "redesign" || action.decision === "keep") {'''
          replacement = '''    if (action.claim_id !== output[index].claim_id) {
                throw new Error(`shot ${index} claim drift blocks rebalance materialization`);
              }
              if (protectedEvidenceIndices.has(index)) continue;
              if (action.decision === "redesign" || action.decision === "keep") {'''
          if text.count(needle) != 1:
            raise SystemExit('claim-drift insertion point changed')
          path.write_text(text.replace(needle, replacement))
          PY

          cat > scripts/lib/orvyq-visual-rebalance-evidence-floor.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { materializeVisualRebalancePlan } from "./orvyq-visual-rebalance.mjs";

          const evidenceShot = (claimId, duration = 4) => ({
            claim_id: claimId,
            duration,
            asset_type: "evidence",
            visual_role: "evidence",
            evidence: { kind: "comparison", source_ids: ["SRC_1"], source_label: "Source" },
          });

          const footageShot = (claimId, duration = 4) => ({
            claim_id: claimId,
            duration,
            asset_type: "footage",
            asset: "assets/footage/original.mp4",
            trim_in_sec: 0,
            trim_out_sec: duration,
          });

          const footageAction = (index, claimId, requestId) => ({
            baseline_shot_index: index,
            claim_id: claimId,
            decision: "replace_contextual_footage",
            projected_medium: "contextual_footage",
            asset_request_id: requestId,
            replacement_assets: [{ asset_path: "assets/footage/replacement.mp4", trim_in_sec: 0, trim_out_sec: 12 }],
            rationale: "Use reviewed contextual footage.",
          });

          test("preserves the last source-backed evidence beat for a claim", () => {
            const result = materializeVisualRebalancePlan({
              shots: [footageShot("CLM_A", 5), evidenceShot("CLM_A", 3)],
              plan: { status: "materialized", actions: [footageAction(1, "CLM_A", "REQ_A")] },
              assetRequests: [{ asset_request_id: "REQ_A", status: "ready" }],
              actionOverrides: [],
            });
            assert.equal(result[1].asset_type, "evidence");
            assert.deepEqual(result[1].evidence.source_ids, ["SRC_1"]);
          });

          test("allows a replacement when another source-backed beat remains", () => {
            const result = materializeVisualRebalancePlan({
              shots: [evidenceShot("CLM_A", 3), evidenceShot("CLM_A", 5)],
              plan: { status: "materialized", actions: [footageAction(0, "CLM_A", "REQ_A")] },
              assetRequests: [{ asset_request_id: "REQ_A", status: "ready" }],
              actionOverrides: [],
            });
            assert.equal(result[0].asset_type, "footage");
            assert.equal(result[1].asset_type, "evidence");
          });

          test("allows old evidence removal when the same claim gains primary evidence", () => {
            const result = materializeVisualRebalancePlan({
              shots: [evidenceShot("CLM_A", 3), footageShot("CLM_A", 5)],
              plan: {
                status: "materialized",
                actions: [
                  footageAction(0, "CLM_A", "REQ_FTG"),
                  {
                    baseline_shot_index: 1,
                    claim_id: "CLM_A",
                    decision: "replace_primary_evidence",
                    projected_medium: "primary_evidence",
                    asset_request_id: "REQ_EVD",
                    replacement_assets: [{
                      asset_path: "assets/evidence/source.png",
                      evidence_asset_id: "EVID_1",
                      source_region: "page 1",
                    }],
                    rationale: "Use the primary source.",
                  },
                ],
              },
              assetRequests: [
                { asset_request_id: "REQ_FTG", status: "ready" },
                { asset_request_id: "REQ_EVD", status: "ready" },
              ],
              primaryEvidenceAssets: [{
                evidence_asset_id: "EVID_1",
                source_ids: ["SRC_2"],
                source_institution: "Institution",
                source_title: "Official source",
                source_date: "2026-01-01",
                source_url: "https://example.test/source",
                content_identity: "official page",
                caption: "Official source page",
                limitation: "Supports only the displayed claim.",
              }],
              actionOverrides: [],
            });
            assert.equal(result[0].asset_type, "footage");
            assert.equal(result[1].asset_type, "evidence");
            assert.deepEqual(result[1].evidence.source_ids, ["SRC_2"]);
          });
          EOF

      - name: Verify focused regression tests
        run: node --test scripts/lib/orvyq-visual-rebalance-evidence-floor.test.mjs

      - name: Commit systemic fix and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/maintenance-preserve-claim-evidence.yml
          git config user.name "ORVYQ Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/lib/orvyq-visual-rebalance.mjs scripts/lib/orvyq-visual-rebalance-evidence-floor.test.mjs .github/workflows/maintenance-preserve-claim-evidence.yml
          git commit -m "fix(pipeline): preserve claim evidence through rebalance"
          git push origin HEAD:agent/systemic-visual-evidence-balance
