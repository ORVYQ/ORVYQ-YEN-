name: ORVYQ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Scan shared runtime for project-specific data
        run: node scripts/orvyq_system_independence_audit.mjs

      - name: Upload system-independence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-system-independence-${{ github.run_id }}
          retention-days: 7
          path: system-independence-report.json
          if-no-files-found: error

      - name: Syntax-check every pipeline script
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile scripts/orvyq_speech_qa.py

      - name: Validate canonical schemas and data contracts
        run: |
          set +e
          npm run validate:canonical 2>&1 | tee schema-validation.log
          echo ${PIPESTATUS[0]} > schema-validation.status
          exit 0

      - name: Upload schema validation diagnostics
        if: ${{ always() && hashFiles('schema-validation.log') != '' && hashFiles('schema-validation.status') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-schema-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            schema-validation.log
            schema-validation.status
          if-no-files-found: error

      - name: Stop when schema validation failed
        run: test "$(cat schema-validation.status)" = "0"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: |
          set +e
          npm test 2>&1 | tee unit-tests.log
          echo ${PIPESTATUS[0]} > unit-tests.status
          exit 0

      - name: Upload unit test diagnostics
        if: ${{ always() && hashFiles('unit-tests.log') != '' && hashFiles('unit-tests.status') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-unit-tests-${{ github.run_id }}
          retention-days: 7
          path: |
            unit-tests.log
            unit-tests.status
          if-no-files-found: error

      - name: Stop when unit tests failed
        run: test "$(cat unit-tests.status)" = "0"

      - name: Check canonical renderer parity and project isolation
        run: npm run orvyq:parity-check

      - name: Install renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Type-check canonical renderer
        working-directory: templates/remotion
        run: npx tsc --noEmit

      - name: Install deterministic Remotion browser
        working-directory: templates/remotion
        run: |
          node --input-type=module -e "import { ensureBrowser } from '@remotion/renderer'; await ensureBrowser({ logLevel: 'info' });"

      - name: Resolve composition against placeholder data without rendering
        working-directory: templates/remotion
        run: |
          set -euo pipefail
          BROWSER="$(find node_modules/.remotion -type f \( -name chrome-headless-shell -o -name chrome \) -perm -111 -print -quit)"
          if [ -z "$BROWSER" ]; then
            echo "Remotion browser installation completed but no executable was found." >&2
            exit 1
          fi
          export FACTFORGE_REMOTION_BROWSER_EXECUTABLE="$BROWSER"
          npx remotion compositions src/index.ts

  acceptance_proof:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/orvyq-cinematic-visual-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SYSTEM_SHA: 281f09282c111f5f5691593c95a8a876bc1b07bb
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Verify clean shared runtime before fixture injection
        run: |
          set -euo pipefail
          mkdir -p acceptance-proof/pre-render
          node scripts/orvyq_system_independence_audit.mjs
          cp system-independence-report.json acceptance-proof/pre-render/system-independence-report.json

      - name: Install media, speech and SVG tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng librsvg2-bin python3-pil

      - name: Install canonical renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Build, render and validate synthetic proof
        run: bash .github/acceptance-proof/run.sh

      - name: Upload verified acceptance proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-cinematic-acceptance-proof-${{ github.run_id }}
          retention-days: 30
          path: |
            acceptance-proof/orvyq-acceptance-proof.mp4
            acceptance-proof/contact-sheet.jpg
            acceptance-proof/proof-validation.json
            acceptance-proof/media-metadata.json
            acceptance-proof/implementation-status.md
            acceptance-proof/sha256sums.txt
            acceptance-proof/opening-plan.json
            acceptance-proof/visual-module-plan.json
            acceptance-proof/final-edit-plan.json
            acceptance-proof/compositions-before.log
            acceptance-proof/compositions-after.log
            acceptance-proof/decode.log
            acceptance-proof/blackdetect.log
            acceptance-proof/frames/*.png
            acceptance-proof/pre-render/*.json
            acceptance-proof/post-render/*.json
          if-no-files-found: error
