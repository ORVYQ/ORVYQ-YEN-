name: ORVYQ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for project-specific data in system runtime
        run: |
          set -euo pipefail
          PROJECT_TOKEN="001-"
          PROJECT_TOKEN="${PROJECT_TOKEN}the-ai-race-no-one-can-afford-to-win"
          ASSET_TOKEN="scene_024_"
          ASSET_TOKEN="${ASSET_TOKEN}6e6f4af26cad60cc78930d6d.mp4"
          RUN_TOKEN="3020"
          RUN_TOKEN="${RUN_TOKEN}0283806"
          : > system-independence-violations.txt
          for TOKEN in "$PROJECT_TOKEN" "$ASSET_TOKEN" "$RUN_TOKEN"; do
            MATCHES="$(grep -RIlF "$TOKEN" .github scripts templates config package.json \
              --exclude=orvyq_repository_independence.test.mjs || true)"
            if [ -n "$MATCHES" ]; then
              {
                echo "TOKEN: $TOKEN"
                echo "$MATCHES"
                echo
              } >> system-independence-violations.txt
            fi
          done
          if [ -s system-independence-violations.txt ]; then
            echo "SYSTEM_INDEPENDENCE_STATUS=1" >> "$GITHUB_ENV"
            cat system-independence-violations.txt
          else
            echo "SYSTEM_INDEPENDENCE_STATUS=0" >> "$GITHUB_ENV"
            echo "No project-specific runtime leakage found."
          fi

      - name: Upload system-independence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-system-independence-${{ github.run_id }}
          retention-days: 7
          path: system-independence-violations.txt
          if-no-files-found: error

      - name: Stop when project data leaked into system runtime
        run: test "$SYSTEM_INDEPENDENCE_STATUS" = "0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Syntax-check every pipeline script
        run: |
          set -euo pipefail
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile scripts/orvyq_speech_qa.py

      - name: Validate canonical schemas and data contracts
        run: |
          set +e
          npm run validate:canonical 2>&1 | tee schema-validation.log
          echo ${PIPESTATUS[0]} > schema-validation.status
          exit 0

      - name: Upload schema validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-schema-validation-${{ github.run_id }}
          retention-days: 7
          path: |
            schema-validation.log
            schema-validation.status
          if-no-files-found: error

      - name: Stop when schema validation failed
        run: test "$(cat schema-validation.status)" = "0"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run unit tests
        run: |
          set +e
          npm test 2>&1 | tee unit-tests.log
          echo ${PIPESTATUS[0]} > unit-tests.status
          exit 0

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orvyq-unit-tests-${{ github.run_id }}
          retention-days: 7
          path: |
            unit-tests.log
            unit-tests.status
          if-no-files-found: error

      - name: Stop when unit tests failed
        run: test "$(cat unit-tests.status)" = "0"

      - name: Check proof/full renderer parity and isolation
        run: npm run orvyq:parity-check

      - name: Install renderer dependencies
        working-directory: templates/remotion
        run: npm ci

      - name: Type-check renderer
        working-directory: templates/remotion
        run: npx tsc --noEmit

      - name: Resolve composition against placeholder data (bundle validation, no render)
        working-directory: templates/remotion
        env:
          FACTFORGE_REMOTION_BROWSER_EXECUTABLE: /opt/hostedtoolcache/chromium/stable/x64/chrome
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then
            echo "No system Chrome/Chromium found; skipping composition resolution (type-check above already passed)."
            exit 0
          fi
          export FACTFORGE_REMOTION_BROWSER_EXECUTABLE="$BROWSER"
          npx remotion compositions src/index.ts

  project002_validation_and_review:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/002-deep-sea-cold-war' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Dispatch exact Candidate Validation, then 720p Full-Length Review
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            const expectedSha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const projectId = '002-the-new-war-beneath-the-ocean';
            const validationWorkflow = 'orvyq-candidate-validation.yml';
            const reviewWorkflow = 'orvyq-review.yml';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function findRun(workflowId, createdAfter) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch,
                event: 'workflow_dispatch',
                per_page: 30
              });
              return data.workflow_runs.find((run) =>
                run.head_sha === expectedSha && Date.parse(run.created_at) >= createdAfter - 5000
              );
            }

            async function waitForNewRun(workflowId, createdAfter) {
              for (let attempt = 0; attempt < 60; attempt += 1) {
                const run = await findRun(workflowId, createdAfter);
                if (run) return run;
                await sleep(10000);
              }
              throw new Error(`Timed out locating ${workflowId} for ${expectedSha}`);
            }

            async function waitForCompletion(runId, maxAttempts) {
              for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
                if (run.status === 'completed') return run;
                await sleep(30000);
              }
              throw new Error(`Timed out waiting for run ${runId}`);
            }

            const validationStartedAt = Date.now();
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: validationWorkflow,
              ref: branch,
              inputs: { project_id: projectId }
            });
            const validationRun = await waitForNewRun(validationWorkflow, validationStartedAt);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `Standalone Project 002 Candidate Validation started: run \`${validationRun.id}\`, source \`${expectedSha}\`.`
            });
            const completedValidation = await waitForCompletion(validationRun.id, 80);
            if (completedValidation.conclusion !== 'success') {
              core.setFailed(`Candidate Validation ${validationRun.id} finished with ${completedValidation.conclusion}`);
              return;
            }

            const reviewStartedAt = Date.now();
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: reviewWorkflow,
              ref: branch,
              inputs: {
                project_id: projectId,
                approved_validation_run_id: String(validationRun.id)
              }
            });
            const reviewRun = await waitForNewRun(reviewWorkflow, reviewStartedAt);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `Project 002 720p Full-Length Review started: run \`${reviewRun.id}\`, validated by \`${validationRun.id}\`, source \`${expectedSha}\`. Final Encode remains blocked.`
            });
            const completedReview = await waitForCompletion(reviewRun.id, 240);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: `Project 002 720p Full-Length Review finished: run \`${reviewRun.id}\`, result=\`${completedReview.conclusion}\`. Final Encode remains blocked pending explicit approval.`
            });
            if (completedReview.conclusion !== 'success') {
              core.setFailed(`Full-Length Review ${reviewRun.id} finished with ${completedReview.conclusion}`);
            }

  project002_candidate_validation:
    if: false
    uses: ./.github/workflows/orvyq-candidate-validation.yml
    with:
      project_id: 002-the-new-war-beneath-the-ocean
    secrets: inherit
