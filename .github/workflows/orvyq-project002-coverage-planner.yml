name: ORVYQ Project 002 Coverage Planner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/orvyq-project002-coverage-planner.yml"

permissions:
  actions: read
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project 002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/002-deep-sea-cold-war
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Restore verified narration alignment from latest validation artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/validation-artifact
          mkdir -p /tmp/validation-artifact
          gh run download 30257567458 \
            --repo "${{ github.repository }}" \
            --name orvyq-candidate-validation-002-the-new-war-beneath-the-ocean-30257567458 \
            --dir /tmp/validation-artifact
          cp /tmp/validation-artifact/projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json \
             projects/002-the-new-war-beneath-the-ocean/voice/narration_alignment.json
          node scripts/orvyq_resolve_pauses.mjs --project-id=002-the-new-war-beneath-the-ocean

      - name: Probe real claim slice counts and capacity
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, pathlib, subprocess

          project = '002-the-new-war-beneath-the-ocean'
          root = pathlib.Path(f'projects/{project}')
          plan_path = root / 'config/editorial_asset_plan.json'
          original = json.loads(plan_path.read_text())

          evidence = json.loads((root / 'research/evidence_map.json').read_text())
          def collect_claims(value, out):
              if isinstance(value, dict):
                  cid = value.get('claim_id')
                  if isinstance(cid, str) and cid.startswith('CLM_') and cid not in out:
                      out.append(cid)
                  for child in value.values(): collect_claims(child, out)
              elif isinstance(value, list):
                  for child in value: collect_claims(child, out)
          claims=[]
          collect_claims(evidence, claims)

          pool = original.get('full_footage_pool', [])
          probe_asset = pool[-1]
          results=[]
          for claim in claims:
              existing = original.get('footage_assignments', {}).get(claim, {})
              max_valid = -1
              for idx in range(0, 50):
                  if str(idx) in existing:
                      max_valid = idx
                      continue
                  trial = copy.deepcopy(original)
                  trial.setdefault('footage_assignments', {}).setdefault(claim, {})[str(idx)] = {
                      'asset': probe_asset,
                      'trimInRatio': 0,
                      'motion': 'hold',
                      'role': 'context',
                      'reuse_reason': 'Temporary coverage-planning probe; never committed to the production branch.'
                  }
                  plan_path.write_text(json.dumps(trial, indent=2) + '\n')
                  proc = subprocess.run(
                      ['node','scripts/orvyq_full_production_plan.mjs',f'--project-id={project}'],
                      text=True, capture_output=True
                  )
                  combined = proc.stdout + '\n' + proc.stderr
                  invalid = (
                      f'{claim}: footage assignment at slice {idx} does not exist' in combined
                      or f'{claim}: footage span starting at slice {idx}' in combined and 'does not exist' in combined
                  )
                  if invalid:
                      break
                  max_valid = idx
              results.append({
                  'claim_id': claim,
                  'slice_count': max_valid + 1,
                  'existing_assignment_indices': sorted(int(x) for x in existing.keys()),
                  'recommended_span2_starts': list(range(0, max_valid + 1, 4)),
                  'recommended_use_count': len(list(range(0, max_valid + 1, 4)))
              })

          plan_path.write_text(json.dumps(original, indent=2) + '\n')
          existing_uses={asset:0 for asset in pool}
          for entries in original.get('footage_assignments', {}).values():
              for assignment in entries.values():
                  asset=assignment.get('asset')
                  if asset in existing_uses: existing_uses[asset]+=1
          for asset,count in original.get('hook_preloaded_usage', {}).items():
              if asset in existing_uses: existing_uses[asset]+=int(count)
          remaining_capacity=sum(max(0,2-count) for count in existing_uses.values())
          recommended_total=sum(x['recommended_use_count'] for x in results)
          existing_body=sum(len(v) for v in original.get('footage_assignments', {}).values())
          report={
              'schema_version':'1.0',
              'project_id':project,
              'policy':'Explicit authored span-2 footage beats every four real narration slices; no audit cap is weakened.',
              'claim_count':len(results),
              'recommended_total_body_uses':recommended_total,
              'existing_body_uses':existing_body,
              'remaining_two-use_capacity':remaining_capacity,
              'estimated_additional_source_uses_required':max(0,recommended_total-existing_body-remaining_capacity),
              'claims':results,
              'asset_usage_including_hook':existing_uses
          }
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/project002-coverage-planning.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Commit coverage planning report to main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "orvyq-coverage-planner"
          git config user.email "orvyq-coverage-planner@users.noreply.github.com"
          git add -f diagnostics/project002-coverage-planning.json
          git commit -m "Record Project 002 creative coverage plan [skip ci]" || exit 0
          git push origin HEAD:main
