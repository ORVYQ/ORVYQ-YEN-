name: ORVYQ One-Time Cinematic Contract Patch

on:
  push:
    branches:
      - agent/orvyq-cinematic-visual-engine
    paths:
      - .github/workflows/orvyq-one-time-cinematic-contract-patch.yml

permissions:
  contents: write

concurrency:
  group: orvyq-one-time-cinematic-contract-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated system branch
        uses: actions/checkout@v4
        with:
          ref: agent/orvyq-cinematic-visual-engine
          fetch-depth: 0

      - name: Apply exact source-neutral contract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          planner = Path('scripts/orvyq_full_production_plan.mjs')
          text = planner.read_text()
          old = 'CLM_020_SYSTEMIC_INCENTIVE_FINAL'
          if old not in text:
              raise SystemExit(f'expected shared claim identifier is missing: {old}')
          planner.write_text(text.replace(old, 'the terminal synthesis claim', 1))

          contract = Path('ORVYQ_SYSTEM.md')
          contract_text = contract.read_text()
          marker = '## 13A. Cinematic visual engine and opening contract'
          if marker not in contract_text:
              section = '''
## 13A. Cinematic visual engine and opening contract

The canonical visual system is project-independent. Shared runtime, schemas, renderer components, QA and workflows must not contain a project ID, claim ID, scene ID, asset name, source-specific rule, video title or historical run ID.

The semantic layer and viewer-facing presentation layer are separate contracts. Semantic fields such as editorial role, evidence relationship, certainty, source type, limitation and provenance remain available to planning and QA, but they are not viewer copy and must not automatically appear on screen.

A full-screen information card is not the canonical visual format. New production must select a source-backed cinematic visual module from the single canonical renderer: footage overlay, document dive, evidence lens, comparison composition, mechanism explainer, data scene, timeline reconstruction, map scene, editorial emphasis moment or chapter transition. A module must have a real or meaningful visual foundation and must reserve mobile and subtitle-safe areas.

Internal metadata labels, enum names, production instructions and QA/debug text are hidden by default. Showing an editorial label requires an explicit presentation intent and must use restrained attribution rather than a dominant technical heading.

Visual-module selection must use semantic need, real asset availability, source-visibility requirements, recent layout history, information density and narrative rhythm. Mechanical round-robin selection, unrelated stock backfill and automatic fallback to a text card are forbidden. If no valid visual module can be built, planning fails loudly and reports the missing asset or visual capability.

The opening engine must generate and score multiple feasible candidates from contradiction, human consequence, object mystery, scale revelation, decision point and archival rupture archetypes. Selection must account for topic specificity, concrete first language, visual showability, curiosity, stakes, non-genericity, real-asset availability, early supportability, central-question strength and narration–visual alignment. The title must not precede curiosity, and verified evidence must enter within the opening quality window.

Candidate Validation must block on presentation-look, visual-diversity, metadata-leakage, opening-quality, text-density, motion-continuity and system-independence audits in addition to all existing evidence, provenance, project-isolation, immutable-candidate and review/final-parity gates.

A short synthetic system acceptance proof may be generated only after static, schema, unit and renderer checks pass. It is not a production proof stage, does not alter the immutable candidate workflow and cannot authorize a Full-Length Review or Final Encode.
'''
              anchor = '\n## 14. Live acceptance record'
              if anchor not in contract_text:
                  raise SystemExit('contract insertion anchor is missing')
              contract.write_text(contract_text.replace(anchor, section + anchor, 1))

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text()
          guard = "    if: ${{ !contains(github.event.pull_request.title || '', '[PATCHING]') && !contains(github.event.head_commit.message || '', '[PATCHING]') }}\n"
          if guard not in ci_text:
              raise SystemExit('temporary CI guard is missing')
          ci.write_text(ci_text.replace(guard, '', 1))

          Path('.github/workflows/orvyq-one-time-cinematic-contract-patch.yml').unlink()
          PY

      - name: Commit the exact isolated patch and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "orvyq-system-patcher"
          git config user.email "orvyq-system-patcher@users.noreply.github.com"
          git add ORVYQ_SYSTEM.md scripts/orvyq_full_production_plan.mjs .github/workflows/ci.yml .github/workflows/orvyq-one-time-cinematic-contract-patch.yml
          git diff --cached --check
          git commit -m "Remove shared claim identifier and update cinematic contract"
          git push origin HEAD:agent/orvyq-cinematic-visual-engine
